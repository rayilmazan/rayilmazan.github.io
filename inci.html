<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eğitim Veri Merkezi (Depolama Modülü)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { background: #121212; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 800px; margin: auto; border: 2px solid #333; padding: 20px; background: #1a1a1a; }
        .box { border: 1px solid #444; padding: 15px; margin-bottom: 15px; }
        textarea { width: 100%; height: 200px; background: #000; color: #0f0; border: 1px solid #333; font-family: monospace; }
        button { padding: 10px; cursor: pointer; background: #333; color: #fff; border: 1px solid #555; }
        .status { margin-top: 10px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <h1>EĞİTİM VERİ MERKEZİ</h1>
    
    <div class="box">
        <label>SORU FOTOĞRAFLARI YÜKLE (Metin Biriktir):</label><br>
        <input type="file" id="imageInput" multiple accept="image/*">
        <button onclick="processAndAppend()">DOKÜMANA EKLE</button>
    </div>

    <div class="box">
        <label>BİRİKEN METİN DOKÜMANI:</label>
        <textarea id="textStorage" placeholder="Burada biriken sorular olacak..."></textarea>
        <button onclick="downloadDocument()">DOKÜMANI İNDİR (.txt)</button>
        <button onclick="uploadDocument()">DOKÜMANI YÜKLE</button>
    </div>

    <div class="box">
        <label>ANALİZ VE PDF ÜRETİMİ:</label><br>
        <input type="password" id="apiKey" placeholder="Gemini API Key...">
        <button onclick="generateFinalPDF()">ANALİZ ET VE PDF'E ÇEVİR</button>
    </div>
    
    <div class="status" id="status">Sistem hazır.</div>
</div>

<script>
    const textStorage = document.getElementById('textStorage');
    const status = document.getElementById('status');

    // 1. FOTOĞRAFLARI OKU VE TEXT ALANINA EKLE
    async function processAndAppend() {
        const files = document.getElementById('imageInput').files;
        const worker = await Tesseract.createWorker('tur');
        status.innerText = "İşleniyor...";
        
        for (let file of files) {
            const ret = await worker.recognize(file);
            textStorage.value += "\n\n--- SORU ---\n" + ret.data.text;
        }
        await worker.terminate();
        status.innerText = "Tüm fotoğraflar metne dönüştürüldü.";
    }

    // 2. DOSYA İŞLEMLERİ (İndirme/Yükleme)
    function downloadDocument() {
        const blob = new Blob([textStorage.value], {type: "text/plain"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "biriken_sorular.txt";
        a.click();
    }

    function uploadDocument() {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = res => textStorage.value = res.target.result;
            reader.readAsText(file);
        };
        input.click();
    }

    // 3. ANALİZ ET VE PDF ÜRET
    async function generateFinalPDF() {
        const apiKey = document.getElementById('apiKey').value;
        const text = textStorage.value;

        status.innerText = "Gemini ile analiz ediliyor, lütfen bekleyin...";
        
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ contents: [{ parts: [{ text: `Aşağıdaki metin biriken yanlış sorular kümesidir. Bunları analiz et ve benzer konularda pekiştirme soruları üret: ${text}` }] }] })
        });

        const data = await response.json();
        const result = data.candidates[0].content.parts[0].text;

        // PDF üretimi (Print özelliği ile)
        const win = window.open('', '', 'width=800,height=600');
        win.document.write(`<html><body><h1>Pekiştirme Soruları</h1><pre style="white-space:pre-wrap;">${result}</pre></body></html>`);
        win.print();
        status.innerText = "İşlem tamamlandı.";
    }
</script>
</body>
</html>
