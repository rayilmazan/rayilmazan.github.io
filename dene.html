
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tam Ekran Su Terazisi</title>
    <style>
        /* Mobil Optimizasyonları */
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* Ana Gövde - Tüm Ekranı Kaplar */
        .level-tool {
            width: 100vw;
            height: 100vh;
            background-color: #222;
            /* Ekran çentiklerini (notch) hesaba katan güvenli padding */
            padding: max(20px, env(safe-area-inset-top)) 
                     max(20px, env(safe-area-inset-right)) 
                     max(20px, env(safe-area-inset-bottom)) 
                     max(20px, env(safe-area-inset-left));
            
            display: grid;
            /* Yatayda geniş alan + 70px dikey tüp alanı */
            grid-template-columns: 1fr 70px;
            /* Dikeyde 70px yatay tüp alanı + geniş alan */
            grid-template-rows: 70px 1fr;
            gap: 20px;
        }

        /* Tüplerin Genel Yapısı */
        .vial {
            border: 4px solid #0a0a0a;
            border-radius: 35px;
            position: relative;
            width: 100%;
            height: 100%;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            background: linear-gradient(to bottom, #ff4757, #ff6b81);
            box-shadow: inset 0 0 12px rgba(0,0,0,0.7);
        }

        /* YATAY TÜP (Üst kenara yaslı) */
        .horizontal {
            grid-column: 1;
            grid-row: 1;
        }

        /* DİKEY TÜP (Sağ kenara yaslı) */
        .vertical {
            grid-column: 2;
            grid-row: 2;
        }

        /* Siyah Hizalama Halkaları (Tam merkeze sabitlendi) */
        .horizontal::before, .horizontal::after {
            content: ''; position: absolute; top: 0; bottom: 0; width: 4px; background-color: rgba(0, 0, 0, 0.6); z-index: 2;
        }
        /* 50px kabarcık + 5px boşluk = merkezden 30px sağa/sola */
        .horizontal::before { left: calc(50% - 30px); }
        .horizontal::after { left: calc(50% + 30px); }

        .vertical::before, .vertical::after {
            content: ''; position: absolute; left: 0; right: 0; height: 4px; background-color: rgba(0, 0, 0, 0.6); z-index: 2;
        }
        .vertical::before { top: calc(50% - 30px); }
        .vertical::after { top: calc(50% + 30px); }

        /* Cam Hava Kabarcığı Efekti */
        .bubble {
            background: radial-gradient(circle, rgba(255,255,255,0.95) 20%, rgba(255,255,255,0.5) 60%, rgba(255,255,255,0) 100%);
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            position: absolute;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.9), 0 3px 6px rgba(0,0,0,0.4);
            transition: transform 0.05s linear;
            z-index: 1;
        }

        /* 70px tüp kalınlığına göre dev kabarcık (50px) */
        .horizontal .bubble {
            width: 50px; height: 50px; top: 6px; left: calc(50% - 25px);
        }
        .vertical .bubble {
            width: 50px; height: 50px; left: 6px; top: calc(50% - 25px);
        }

        /* Sol Alt Kısım - Açı Değerleri ve Buton */
        .dashboard {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .info-text {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 280px;
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05);
        }

        /* Başlatma Butonu */
        button {
            width: 100%;
            max-width: 280px;
            padding: 20px;
            font-size: 20px;
            background-color: #ffffff;
            color: #1a1a1a;
            font-weight: bold;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
            margin-bottom: 10px;
        }
        button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="level-tool">
        <!-- Yatay Tüp -->
        <div class="vial horizontal" id="h-vial">
            <div id="h-bubble" class="bubble"></div>
        </div>
        
        <!-- Köşe boşluğu (Grid col 2, row 1 boş bırakılıyor) -->
        <div></div>

        <!-- Açı Göstergeleri ve Kontrol -->
        <div class="dashboard">
            <button id="start-btn">Teraziyi Aktif Et</button>
            <div class="info-text" id="h-text">Yatay Eğim: 0°</div>
            <div class="info-text" id="v-text">Dikey Eğim: 0°</div>
        </div>

        <!-- Dikey Tüp -->
        <div class="vial vertical" id="v-vial">
            <div id="v-bubble" class="bubble"></div>
        </div>
    </div>

    <script>
        const hBubble = document.getElementById('h-bubble');
        const vBubble = document.getElementById('v-bubble');
        const hVial = document.getElementById('h-vial');
        const vVial = document.getElementById('v-vial');
        const hText = document.getElementById('h-text');
        const vText = document.getElementById('v-text');
        const startBtn = document.getElementById('start-btn');

        const maxAngle = 15; 
        const bubbleSize = 50; // Kabarcık boyutu güncellendi

        // Renk fonksiyonları
        function setVialGreen(element) {
            element.style.background = "linear-gradient(to right, #2ecc71, #27ae60)";
            element.style.boxShadow = "inset 0 0 15px rgba(0,0,0,0.6), 0 0 25px rgba(46, 204, 113, 0.5)";
        }

        function setVialRed(element) {
            element.style.background = "linear-gradient(to right, #ff4757, #ff6b81)";
            element.style.boxShadow = "inset 0 0 15px rgba(0,0,0,0.8), 0 0 20px rgba(255, 71, 87, 0.2)";
        }

        function updateLevel(event) {
            let beta = event.beta;   // Dikey (Ön/Arka)
            let gamma = event.gamma; // Yatay (Sağ/Sol)

            // Responsive olarak her saniye tüpün güncel boyutunu ölçer
            const maxMoveX = (hVial.clientWidth - bubbleSize) / 2 - 4; 
            const maxMoveY = (vVial.clientHeight - bubbleSize) / 2 - 4;

            // 1. YATAY EKSEN 
            let hAngle = gamma;
            if (hAngle > maxAngle) hAngle = maxAngle;
            if (hAngle < -maxAngle) hAngle = -maxAngle;
            let moveX = (hAngle / maxAngle) * maxMoveX;
            hBubble.style.transform = `translateX(${moveX}px)`;
            hText.innerText = `Yatay Eğim: ${Math.round(gamma)}°`;

            // 2. DİKEY EKSEN 
            let vAngle = beta;
            if (vAngle > maxAngle) vAngle = maxAngle;
            if (vAngle < -maxAngle) vAngle = -maxAngle;
            let moveY = (vAngle / maxAngle) * maxMoveY;
            vBubble.style.transform = `translateY(${moveY}px)`;
            vText.innerText = `Dikey Eğim: ${Math.round(beta)}°`;
            
            // 3. RENK KONTROLLERİ (±1 derece tolerans)
            const isHorizontalBalanced = Math.abs(Math.round(gamma)) <= 1;
            const isVerticalBalanced = Math.abs(Math.round(beta)) <= 1;

            if (isHorizontalBalanced) setVialGreen(hVial); else setVialRed(hVial);
            if (isVerticalBalanced) setVialGreen(vVial); else setVialRed(vVial);
        }

        // Sensör İzinleri ve Başlatma
        startBtn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', updateLevel);
                            startBtn.style.display = 'none';
                        } else {
                            alert('Sensör izni verilmedi.');
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', updateLevel);
                startBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
