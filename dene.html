<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rayılmazan</title>
<style>
  /* Used Future & Greebles Tema */
  body {
    background-color: #3b3b3b;
    color: #c0c0c0;
    font-family: 'Courier New', Courier, monospace;
    margin: 0; 
    padding: 20px;
    /* Mekanik, paslı ve çizik yüzey dokusu */
    background-image: 
      repeating-linear-gradient(45deg, #333 25%, transparent 25%, transparent 75%, #333 75%, #333), 
      repeating-linear-gradient(45deg, #333 25%, #3b3b3b 25%, #3b3b3b 75%, #333 75%, #333);
    background-position: 0 0, 10px 10px;
    background-size: 20px 20px;
  }

  /* Sol hizalı, %70 küçültülmüş logo alanı */
  .header-container {
    display: flex;
    align-items: center;
    justify-content: flex-start; /* Sola dayalı düzen */
    background: #222;
    border: 3px solid #5a5a5a;
    border-radius: 2px;
    padding: 10px 20px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 2px 2px 5px rgba(0,0,0,0.5);
    margin-bottom: 20px;
    max-width: 800px;
  }

  .logo {
    width: 30%; /* Orjinalin %30'u boyutunda (%70 küçültme) */
    max-width: 80px; 
    margin-right: 20px;
    filter: grayscale(100%) contrast(150%) drop-shadow(2px 2px 2px #000);
  }

  .title {
    font-size: 28px;
    font-weight: bold;
    color: #8c8c8c;
    text-shadow: -1px -1px 0 #555, 2px 2px 0 #000;
    letter-spacing: 2px;
  }

  /* Mekanik Panel Görünümü */
  .control-panel {
    background: #2a2a2a;
    border: 4px solid #4d4d4d;
    border-top-color: #7a7a7a; 
    border-left-color: #7a7a7a;
    padding: 20px;
    max-width: 800px;
    position: relative;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.6);
  }

  .btn {
    background: #444;
    color: #ccc;
    border: 2px solid #222;
    border-top-color: #888;
    border-left-color: #888;
    padding: 10px 15px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    margin-right: 10px;
    text-transform: uppercase;
  }
  .btn:active {
    border: 2px solid #888;
    border-top-color: #222;
    border-left-color: #222;
  }

  /* Performans Çubuğu */
  .perf-monitor {
    width: 100%; height: 15px; 
    background: #111; 
    border: 1px solid #444;
    margin-top: 15px;
    position: relative;
  }
  .perf-bar {
    width: 0%; height: 100%; 
    background: #556b2f; /* Eski tip fosforlu yeşilimsi renk */
    transition: width 0.3s;
  }

  /* Tuval (Canvas) Etkileşim Alanı */
  #screenCanvas {
    background: #000;
    border: 3px dashed #5a5a5a;
    margin-top: 20px;
    cursor: crosshair;
    width: 100%;
    max-width: 800px;
    height: auto;
  }
</style>
</head>
<body>

<div class="header-container">
  <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Endüstriyel Çark/Makine Temalı Logo Yer Tutucu -->
    <circle cx="50" cy="50" r="45" fill="#2a2a2a" stroke="#666" stroke-width="6" stroke-dasharray="10 5"/>
    <circle cx="50" cy="50" r="20" fill="#444" stroke="#777" stroke-width="3"/>
  </svg>
  <div class="title">rayılmazan</div>
</div>

<div class="control-panel">
  <button class="btn" onclick="generateQR()">Cihazı Bekle (QR Üret)</button>
  <button class="btn" onclick="scanQR()">QR Tara & Eşleş</button>
  
  <div id="qr-display" style="margin-top:15px; color:#a3a3a3;"></div>
  
  <!-- Sadece Tarayıcı Üzerinde Çalışacak Etkileşim Ekranı -->
  <canvas id="screenCanvas" width="800" height="450"></canvas>
  
  <div class="perf-monitor">
    <div class="perf-bar" id="signalBar" style="width: 85%;"></div>
  </div>
</div>

<script>
  // NOT: Gerçek sürümde QR kod üretme (örneğin qrcode.js) ve okuma (jsQR) 
  // kütüphanelerinin sıkıştırılmış halleri CDN olmadan doğrudan bu alana yapıştırılacaktır.

  const canvas = document.getElementById('screenCanvas');
  const ctx = canvas.getContext('2d');
  let peerConnection;
  let dataChannel;

  function generateQR() {
      // 1. WebRTC bağlantı teklifi oluşturulur.
      // 2. SDP verisi gömülü kütüphane ile QR koda dönüştürülüp #qr-display içine basılır.
      document.getElementById('qr-display').innerText = "[ Sistem QR Kodu Oluşturuyor... ]";
  }

  function scanQR() {
      // 1. Cihaz kamerası açılır.
      // 2. Karşı cihazdaki QR taranıp içindeki bağlantı yanıtı (Answer) WebRTC'ye işlenir.
      document.getElementById('qr-display').innerText = "[ Kamera Bekleniyor... ]";
  }

  // Tarayıcı Sınırları İçerisinde Fare (Sanal İmleç) Simülasyonu
  canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      // Yalnızca canvas içindeki X ve Y koordinatları hesaplanır
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      
      // Çizim işlemi (simülasyon amaçlı)
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#666';
      ctx.fillRect(x - 5, y - 5, 10, 10);

      // Veri kanalı açıksa Android'e gönder
      if (dataChannel && dataChannel.readyState === 'open') {
          dataChannel.send(JSON.stringify({ type: 'move', x: x, y: y }));
      }
  });

  // Performans Çubuğunu Güncelleme (Gecikme/Bitrate simülasyonu)
  setInterval(() => {
      const bar = document.getElementById('signalBar');
      const fluctuation = Math.floor(Math.random() * 10) - 5; 
      let currentWidth = parseInt(bar.style.width);
      bar.style.width = Math.min(100, Math.max(40, currentWidth + fluctuation)) + '%';
  }, 2000);
</script>
</body>
</html>
