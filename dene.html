<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kişisel Fikir Asistanı // Yerel</title>
    <style>
        /* Tasarımı daha "karanlık" ve "özel" bir moda alıyorum */
        body { background: #0d0d0d; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 800px; margin: auto; border: 1px solid #333; padding: 20px; border-radius: 5px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; background: #1a1a1a; color: #fff; border: 1px solid #444; }
        button { cursor: pointer; background: #333; font-weight: bold; }
        button:hover { background: #444; }
        #output { margin-top: 20px; white-space: pre-wrap; border-top: 1px solid #333; padding-top: 20px; }
        .system-msg { color: #888; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <h3>[YEREL_FİKİR_MAKİNESİ]</h3>
    <p class="system-msg">Bu araç tarayıcında çalışır. Hiçbir veri dışarıya kaydedilmez.</p>
    
    <input type="password" id="apiKey" placeholder="Gemini API Anahtarın (Sadece bu oturumda tutulur)">
    <input type="text" id="rssUrl" value="https://rayilmazan.github.io/haber" placeholder="RSS Kaynağı">
    <button onclick="calistir()">[ ANALİZİ BAŞLAT ]</button>

    <div id="output"></div>
</div>

<script>
    const CORS_PROXY = "https://api.allorigins.win/get?url="; // XML okumak için gerekli

    async function calistir() {
        const key = document.getElementById('apiKey').value;
        const rss = document.getElementById('rssUrl').value;
        const out = document.getElementById('output');
        
        if(!key) { alert("Anahtar gir!"); return; }
        out.innerHTML = "RSS çekiliyor...";

        try {
            // 1. RSS Verisini Çek
            const response = await fetch(CORS_PROXY + encodeURIComponent(rss));
            const data = await response.json();
            const xml = new DOMParser().parseFromString(data.contents, "text/xml");
            const items = Array.from(xml.querySelectorAll("item")).slice(0, 5);
            const metinler = items.map(i => i.querySelector("title").textContent).join(" | ");

            out.innerHTML = "Veri alındı, AI analiz ediyor...";

            // 2. AI Analizi
            const prompt = `Sen benim kişisel yaratıcılık asistanımsın. Şu haber başlıklarını analiz et ve bunlardan yola çıkarak "kalıpların dışında" pratik bir proje fikri üret: ${metinler}`;
            
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const json = await res.json();
            out.innerHTML = json.candidates[0].content.parts[0].text;

        } catch (e) {
            out.innerHTML = "HATA: " + e.message;
        }
    }
</script>
</body>
</html>
