<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USED FUTURE // LOGO TERMINAL</title>
    <style>
        :root {
            --amber-main: #ff9d00;
            --amber-glow: #ff5500;
            --amber-dim: #553300;
            --bg-dark: #0a0804;
            --crt-line: rgba(18, 12, 4, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--amber-main);
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* CRT Terminal Ekran Çerçevesi */
        .crt-container {
            position: relative;
            width: 90vw;
            max-width: 650px;
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle, #1a1208 0%, #050402 100%);
            border: 3px solid var(--amber-dim);
            border-radius: 20px;
            box-shadow: 
                0 0 30px rgba(255, 157, 0, 0.15),
                inset 0 0 80px rgba(0, 0, 0, 0.9);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Scanline Efekti */
        .crt-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(var(--crt-line) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Vignette Karartma */
        .crt-container::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.85) 100%);
            z-index: 11;
            pointer-events: none;
        }

        /* Telemetri Başlıkları */
        .hud-header, .hud-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--amber-glow);
            z-index: 5;
            opacity: 0.85;
        }

        .status-tag {
            background-color: var(--amber-main);
            color: #000;
            padding: 2px 6px;
            font-weight: bold;
        }

        .viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        /* Logo Parıltısı ve Efektler */
        .used-future-logo {
            width: 70%;
            height: 70%;
            filter: drop-shadow(0 0 10px var(--amber-glow)) 
                    drop-shadow(0 0 20px var(--amber-main))
                    url(#used-texture);
            animation: subtle-flicker 0.15s infinite alternate;
        }

        /* Izgara Arka Planı */
        .grid-bg {
            stroke: var(--amber-dim);
            stroke-width: 0.5;
            opacity: 0.25;
        }

        @keyframes subtle-flicker {
            0% { opacity: 0.96; }
            50% { opacity: 1; }
            100% { opacity: 0.93; }
        }
    </style>
</head>
<body>

    <div class="crt-container">
        <!-- Telemetri Üst Bilgi -->
        <div class="hud-header">
            <span>SYS_ID // UF-8086</span>
            <span class="status-tag">ONLINE</span>
            <span>240V PHOSPHOR</span>
        </div>

        <!-- Ana Logo Alanı -->
        <div class="viewport">
            <svg class="used-future-logo" viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Used Future / Grunge Aşınma Filtresi -->
                    <filter id="used-texture" x="0%" y="0%" width="100%" height="100%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
                    </filter>
                </defs>

                <!-- Hizalama Izgarası -->
                <g class="grid-bg">
                    <line x1="90" y1="0" x2="90" y2="360" />
                    <line x1="135" y1="0" x2="135" y2="360" />
                    <line x1="205" y1="0" x2="205" y2="360" />
                    <line x1="0" y1="90" x2="300" y2="90" />
                    <line x1="0" y1="270" x2="300" y2="270" />
                </g>

                <!-- Birebir Oranlı Logo Geometrisi -->
                <g fill="var(--amber-main)">
                    <!-- Dikey Blok + Çapraz Bacak (Orijinal Ölçü Kesiti) -->
                    <path d="
                        M 90,90 
                        H 135 
                        V 165 
                        L 205,235 
                        V 270 
                        H 160 
                        L 135,245 
                        V 270 
                        H 90 
                        Z
                    " />

                    <!-- Üst İnce Çember (Üst Sınırı Dikey Blok ile Birebir Aynı Hizada) -->
                    <circle cx="160" cy="135" r="45" 
                            fill="none" 
                            stroke="var(--amber-main)" 
                            stroke-width="5" />
                </g>

                <!-- Yüzey Çizikleri ve Eskitme Detayları -->
                <path d="M 85,110 L 140,110 M 100,260 L 195,260 M 145,180 L 185,220" 
                      stroke="var(--bg-dark)" 
                      stroke-width="2" 
                      opacity="0.7" />
            </svg>
        </div>

        <!-- Telemetri Alt Bilgi -->
        <div class="hud-footer">
            <span>MEM: 640KB OK</span>
            <span>RAYILMAZAN // SYSTEM</span>
            <span>REV. 2026</span>
        </div>
    </div>

</body>
</html>
