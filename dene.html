<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Küçültme Aracı</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .file-drop-area {
            border: 2px dashed #007bff;
            padding: 30px 20px;
            border-radius: 8px;
            cursor: pointer;
            color: #007bff;
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        .file-drop-area:hover {
            background-color: #f0f8ff;
        }
        input[type="file"] {
            display: none;
        }
        #fileName {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
            word-break: break-all;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>PDF Küçültme Aracı</h2>
    <form id="pdfForm">
        <label for="pdfFile" class="file-drop-area">
            <span>PDF Dosyasını Seçmek İçin Tıklayın</span>
            <input type="file" id="pdfFile" accept="application/pdf" required>
        </label>
        <div id="fileName"></div>
        <button type="submit" id="submitBtn">PDF'i Küçült</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const fileInput = document.getElementById('pdfFile');
    const fileNameDiv = document.getElementById('fileName');
    const form = document.getElementById('pdfForm');
    const statusDiv = document.getElementById('status');

    // Dosya seçildiğinde adını göster
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            fileNameDiv.textContent = `Seçilen Dosya: ${e.target.files[0].name}`;
        }
    });

    // Form gönderildiğinde yapılacak işlemler
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const file = fileInput.files[0];
        
        if (!file) {
            alert('Lütfen bir PDF dosyası seçin.');
            return;
        }

        statusDiv.textContent = "Dosya işleniyor, lütfen bekleyin...";
        
        // Simülasyon (Gerçek sıkıştırma için buraya sunucu taraflı API veya 
        // istemci tarafı kütüphane entegrasyonu [örn: pdf-lib] yapılmalıdır)
        setTimeout(() => {
            statusDiv.innerHTML = "<span style='color: green;'>Arayüz başarıyla hazırlandı! Gerçek sıkıştırma için sunucu tarafı kodları gereklidir.</span>";
        }, 2000);
    });
</script>

</body>
</html>
