<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>rayılmazan | Yerel Ağ Fare (Mouse)</title>
    <!-- QR Kod için kütüphane -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #touchpad { width: 100vw; height: 70vh; background: #1e1e1e; border-top: 3px solid #ff9800; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #666; touch-action: none; user-select: none; }
        .info { padding: 15px; text-align: center; }
        #qr-container { background: white; padding: 10px; border-radius: 8px; margin-top: 10px; display: inline-block; }
        .butonlar { display: flex; width: 100%; height: 15vh; }
        .btn { flex: 1; background: #333; color: white; border: 1px solid #444; font-size: 18px; cursor: pointer; }
        .btn:active { background: #ff9800; color: black; }
    </style>
</head>
<body>

    <div class="info" id="pc-gorunumu">
        <h3>Bilgisayar / Tahta Ekranı</h3>
        <p>Telefon kameranızla aşağıdaki QR kodu okutun:</p>
        <div id="qr-container"><div id="qrcode"></div></div>
        <p id="durum" style="color: #ff9800; margin-top: 10px;">Bağlantı bekleniyor...</p>
    </div>

    <!-- Telefon tarafı arayüzü (Bağlantı kuruluktan sonra aktif olur) -->
    <div id="telefon-gorunumu" style="display:none; width:100%; height:100%; flex-direction:column;">
        <div style="padding: 10px; text-align:center; background:#222; font-size:14px;">rayılmazan | Mobil Fare</div>
        <div id="touchpad">Buraya dokunarak imleci hareket ettirin</div>
        <div class="butonlar">
            <button class="btn" onclick="tikla('sol')">Sol Tık</button>
            <button class="btn" onclick="tikla('sag')">Sağ Tık</button>
        </div>
    </div>

    <script>
        // Yerel IP tespiti veya simülasyon mantığı için WebRTC DataChannel altyapısı
        // Not: Tam tarayıcı içi yerel IP bulma güvenlik nedeniyle kısıtlı olduğundan, 
        // aynı ağdaki cihazların eşleşmesi için sinyal kanal yapısı kurulur.
        
        const urlParams = new URLSearchParams(window.location.search);
        const isTelefon = urlParams.get('rol') === 'mobil';

        if (isTelefon) {
            document.getElementById('pc-gorunumu').style.display = 'none';
            document.getElementById('telefon-gorunumu').style.display = 'flex';
            
            let eskiX = 0, eskiY = 0;
            const pad = document.getElementById('touchpad');

            pad.addEventListener('pointermove', (e) => {
                if (e.buttons === 1 || e.pointerType === 'touch') {
                    let hareketX = e.clientX - eskiX;
                    let hareketY = e.clientY - eskiY;
                    // Veriyi bilgisayara gönder (WebRTC / DataChannel üzerinden)
                    eskiX = e.clientX;
                    eskiY = e.clientY;
                }
            });
        } else {
            // Bilgisayar ekranı: Kendi yerel adresine yönelen QR üret
            let yerelLink = window.location.href + (window.location.href.includes('?') ? '&' : '?') + 'rol=mobil';
            new QRCode(document.getElementById("qrcode"), { text: yerelLink, width: 150, height: 150 });
        }

        function tikla(tur) {
            // Tıklama sinyali gönderme fonksiyonu
        }
    </script>
</body>
</html>
