<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>rayılmazan | Yerel Ağ Pano ve Transfer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        textarea { width: 100%; height: 120px; background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: #ff9800; color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; font-size: 16px; }
        button:active { background: #e68900; }
        #qr-box { background: #fff; padding: 10px; display: inline-block; margin-top: 15px; border-radius: 4px; }
        .bilgi { font-size: 13px; color: #aaa; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>rayılmazan | Yerel Ağ Pano</h2>
        <p class="bilgi">Aynı Wi-Fi ağındaki telefonunla veya başka bir cihazla metin paylaş.</p>
        
        <textarea id="veriAlani" placeholder="Buraya yazılanlar ve gelenler senkronize olur..."></textarea>
        <button onclick="gonder()">Panoya Kaydet / Güncelle</button>

        <div style="text-align: center; margin-top: 20px;">
            <p class="bilgi">Telefondan açmak için bu QR'ı okut:</p>
            <div id="qr-box"><div id="qrcode"></div></div>
        </div>
    </div>

    <script>
        // Sayfa yüklendiğinde yerel hafızadaki veriyi getir
        const veriAlani = document.getElementById('veriAlani');
        
        function verileriCek() {
            let kayitliVeri = localStorage.getItem('rayilmazan_pano');
            if (kayitliVeri && kayitliVeri !== veriAlani.value) {
                veriAlani.value = kayitliVeri;
            }
        }

        function gonder() {
            localStorage.setItem('rayilmazan_pano', veriAlani.value);
            alert('Pano güncellendi!');
        }

        // Otomatik senkronizasyon için saniyede bir kontrol
        setInterval(verileriCek, 1000);

        // QR Kod oluşturma (Mevcut yerel IP adresini baz alır)
        let aktifAdres = window.location.href;
        new QRCode(document.getElementById("qrcode"), {
            text: aktifAdres,
            width: 140,
            height: 140
        });
    </script>
</body>
</html>
