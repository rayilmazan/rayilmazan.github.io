<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tam Ekran Su Terazisi</title>
    <style>
        /* Mobil Optimizasyonları */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh; /* Dynamic viewport height ile mobil adres çubuğu taşması engellendi */
            background-color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* Ana Gövde - Tüm Ekranı Kaplar */
        .level-tool {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #1a1a1a;
            
            /* Güvenli kenar boşlukları */
            padding: max(15px, env(safe-area-inset-top)) 
                     max(15px, env(safe-area-inset-right)) 
                     max(15px, env(safe-area-inset-bottom)) 
                     max(15px, env(safe-area-inset-left));
            
            display: grid;
            grid-template-columns: 1fr 60px; /* Dikey tüp genişliği 60px yapıldı */
            grid-template-rows: 60px 1fr;    /* Yatay tüp yüksekliği 60px yapıldı */
            gap: 15px;
            overflow: hidden;
        }

        /* Tüplerin Genel Yapısı */
        .vial {
            border: 3px solid #000000;
            border-radius: 30px;
            position: relative;
            width: 100%;
            height: 100%;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            background: linear-gradient(to right, #ff4757, #ff6b81);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* YATAY TÜP (Üst kenara yaslı) */
        .horizontal {
            grid-column: 1;
            grid-row: 1;
        }

        /* DİKEY TÜP (Sağ kenara yaslı) */
        .vertical {
            grid-column: 2;
            grid-row: 2;
        }

        /* Siyah Hizalama Halkaları */
        .horizontal::before, .horizontal::after {
            content: ''; position: absolute; top: 0; bottom: 0; width: 3px; background-color: rgba(0, 0, 0, 0.7); z-index: 2;
        }
        .horizontal::before { left: calc(50% - 25px); }
        .horizontal::after { left: calc(50% + 25px); }

        .vertical::before, .vertical::after {
            content: ''; position: absolute; left: 0; right: 0; height: 3px; background-color: rgba(0, 0, 0, 0.7); z-index: 2;
        }
        .vertical::before { top: calc(50% - 25px); }
        .vertical::after { top: calc(50% + 25px); }

        /* Cam Hava Kabarcığı Efekti */
        .bubble {
            background: radial-gradient(circle, rgba(255,255,255,0.95) 20%, rgba(255,255,255,0.5) 60%, rgba(255,255,255,0) 100%);
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            position: absolute;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.9), 0 2px 5px rgba(0,0,0,0.4);
            transition: transform 0.05s linear;
            z-index: 1;
        }

        /* 60px tüp kalınlığına uygun kabarcık (44px) */
        .horizontal .bubble {
            width: 44px; height: 44px; top: 5px; left: calc(50% - 22px);
        }
        .vertical .bubble {
            width: 44px; height: 44px; left: 5px; top: calc(50% - 22px);
        }

        /* Sol Alt Kısım - Açı Değerleri ve Buton */
        .dashboard {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            height: 100%;
        }

        .info-text {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 20px;
            border-radius: 14px;
            width: 100%;
            max-width: 260px;
            text-align: center;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.08);
        }

        /* Başlatma Butonu */
        button {
            width: 100%;
            max-width: 260px;
            padding: 18px;
            font-size: 18px;
            background-color: #ffffff;
            color: #111111;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
        }
        button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="level-tool">
        <!-- Yatay Tüp -->
        <div class="vial horizontal" id="h-vial">
            <div id="h-bubble" class="bubble"></div>
        </div>
        
        <!-- Köşe boşluğu -->
        <div></div>

        <!-- Açı Göstergeleri ve Kontrol -->
        <div class="dashboard">
            <button id="start-btn">Teraziyi Aktif Et</button>
            <div class="info-text" id="h-text">Yatay Eğim: 0°</div>
            <div class="info-text" id="v-text">Dikey Eğim: 0°</div>
        </div>

        <!-- Dikey Tüp -->
        <div class="vial vertical" id="v-vial">
            <div id="v-bubble" class="bubble"></div>
        </div>
    </div>

    <script>
        const hBubble = document.getElementById('h-bubble');
        const vBubble = document.getElementById('v-bubble');
        const hVial = document.getElementById('h-vial');
        const vVial = document.getElementById('v-vial');
        const hText = document.getElementById('h-text');
        const vText = document.getElementById('v-text');
        const startBtn = document.getElementById('start-btn');

        const maxAngle = 15; 
        const bubbleSize = 44; // Kabarcık boyutu güncellendi

        function setVialGreen(element) {
            element.style.background = "linear-gradient(to right, #2ecc71, #27ae60)";
            element.style.boxShadow = "inset 0 0 12px rgba(0,0,0,0.6), 0 0 20px rgba(46, 204, 113, 0.4)";
        }

        function setVialRed(element) {
            element.style.background = "linear-gradient(to right, #ff4757, #ff6b81)";
            element.style.boxShadow = "inset 0 0 12px rgba(0,0,0,0.8)";
        }

        function updateLevel(event) {
            let beta = event.beta;   // Dikey (Ön/Arka)
            let gamma = event.gamma; // Yatay (Sağ/Sol)

            const maxMoveX = (hVial.clientWidth - bubbleSize) / 2 - 3; 
            const maxMoveY = (vVial.clientHeight - bubbleSize) / 2 - 3;

            // 1. YATAY EKSEN 
            let hAngle = gamma;
            if (hAngle > maxAngle) hAngle = maxAngle;
            if (hAngle < -maxAngle) hAngle = -maxAngle;
            let moveX = (hAngle / maxAngle) * maxMoveX;
            hBubble.style.transform = `translateX(${moveX}px)`;
            hText.innerText = `Yatay Eğim: ${Math.round(gamma)}°`;

            // 2. DİKEY EKSEN 
            let vAngle = beta;
            if (vAngle > maxAngle) vAngle = maxAngle;
            if (vAngle < -maxAngle) vAngle = -maxAngle;
            let moveY = (vAngle / maxAngle) * maxMoveY;
            vBubble.style.transform = `translateY(${moveY}px)`;
            vText.innerText = `Dikey Eğim: ${Math.round(beta)}°`;
            
            // 3. RENK KONTROLLERİ
            const isHorizontalBalanced = Math.abs(Math.round(gamma)) <= 1;
            const isVerticalBalanced = Math.abs(Math.round(beta)) <= 1;

            if (isHorizontalBalanced) setVialGreen(hVial); else setVialRed(hVial);
            if (isVerticalBalanced) setVialGreen(vVial); else setVialRed(vVial);
        }

        // Sensör İzinleri
        startBtn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', updateLevel);
                            startBtn.style.display = 'none';
                        } else {
                            alert('Sensör izni verilmedi.');
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', updateLevel);
                startBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
