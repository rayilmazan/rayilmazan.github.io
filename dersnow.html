<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğretmen Takip Sistemi</title>
    <style>
        :root {
            --bg-color: #121413;
            --panel-bg: #1c211f;
            --border-metal: #4a5550;
            --accent-green: #00ff66;
            --accent-dim: #003311;
            --accent-amber: #ffb000;
            --text-main: #c0d1c7;
            --text-bright: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.3) 2px, rgba(0, 0, 0, 0.3) 4px);
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border: 2px solid var(--border-metal);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            padding: 20px;
        }

        .header { border-bottom: 2px dashed var(--border-metal); padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .header h2 { font-size: 1.3rem; color: var(--text-bright); font-weight: bold; }
        .clock-box { font-size: 0.9rem; color: var(--accent-amber); margin-top: 5px; }

        .nav-panel { display: flex; justify-content: space-between; align-items: center; background: #151917; border: 1px solid var(--border-metal); padding: 10px; margin-bottom: 20px; }
        .nav-btn { background: #222b26; color: var(--accent-green); border: 1px solid var(--accent-green); padding: 8px 15px; cursor: pointer; font-weight: bold; }
        .nav-btn:hover { background: var(--accent-green); color: var(--bg-color); }

        #current-day-title { font-size: 1.2rem; color: var(--text-bright); font-weight: bold; }

        .timeline { display: flex; flex-direction: column; gap: 10px; }
        .slot-card { display: flex; justify-content: space-between; align-items: center; background: #161b18; border: 1px solid #2a3630; padding: 12px 15px; border-radius: 3px; }
        .slot-time { font-size: 0.85rem; color: #8fa398; min-width: 95px; }
        .slot-info { flex-grow: 1; text-align: left; padding-left: 15px; }
        .slot-class { font-size: 1.1rem; font-weight: bold; color: var(--text-main); }
        .slot-desc { font-size: 0.8rem; color: #6c8275; text-transform: uppercase; }

        /* Aktif Ders */
        .active-lesson { background: var(--accent-dim); border-color: var(--accent-green); box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
        .active-lesson .slot-class { color: var(--accent-green); }
        
        /* Tenefüs */
        .break-time { background: #262012; border-color: var(--accent-amber); }
        .break-time .slot-class { color: var(--accent-amber); }

        .weekend-msg { text-align: center; padding: 40px; color: var(--accent-green); font-size: 1.5rem; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>RAMAZAN YILMAZ</h2>
            <div class="clock-box" id="live-clock">Sistem Hazırlanıyor...</div>
        </div>

        <div class="nav-panel">
            <button class="nav-btn" onclick="changeDay(-1)">◄</button>
            <span id="current-day-title">YÜKLENİYOR</span>
            <button class="nav-btn" onclick="changeDay(1)">►</button>
        </div>

        <div class="timeline" id="timeline-container"></div>
    </div>

    <script>
        const schedule = {
            "Pazartesi": [
                { period: 1, start: "12:50", end: "13:20", class: "11-C", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 2, start: "13:30", end: "14:00", class: "11-C", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 3, start: "14:05", end: "14:35", class: "11-E", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 4, start: "14:40", end: "15:10", class: "11-E", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 5, start: "15:15", end: "15:45", class: "BOŞ", subject: "DERS YOK" },
                { period: 6, start: "15:50", end: "16:20", class: "BOŞ", subject: "DERS YOK" },
                { period: 7, start: "16:25", end: "16:55", class: "BOŞ", subject: "DERS YOK" },
                { period: 8, start: "17:00", end: "17:30", class: "BOŞ", subject: "DERS YOK" }
            ],
            "Salı": [
                { period: 1, start: "12:50", end: "13:20", class: "10-A", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 2, start: "13:30", end: "14:00", class: "10-A", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 3, start: "14:05", end: "14:35", class: "BOŞ", subject: "DERS YOK" },
                { period: 4, start: "14:40", end: "15:10", class: "BOŞ", subject: "DERS YOK" },
                { period: 5, start: "15:15", end: "15:45", class: "BOŞ", subject: "DERS YOK" },
                { period: 6, start: "15:50", end: "16:20", class: "BOŞ", subject: "DERS YOK" },
                { period: 7, start: "16:25", end: "16:55", class: "BOŞ", subject: "DERS YOK" },
                { period: 8, start: "17:00", end: "17:30", class: "BOŞ", subject: "DERS YOK" }
            ],
            "Çarşamba": [
                { period: 1, start: "12:50", end: "13:20", class: "BOŞ", subject: "DERS YOK" },
                { period: 2, start: "13:30", end: "14:00", class: "BOŞ", subject: "DERS YOK" },
                { period: 3, start: "14:05", end: "14:35", class: "BOŞ", subject: "DERS YOK" },
                { period: 4, start: "14:40", end: "15:10", class: "BOŞ", subject: "DERS YOK" },
                { period: 5, start: "15:15", end: "15:45", class: "BOŞ", subject: "DERS YOK" },
                { period: 6, start: "15:50", end: "16:20", class: "BOŞ", subject: "DERS YOK" },
                { period: 7, start: "16:25", end: "16:55", class: "BOŞ", subject: "DERS YOK" },
                { period: 8, start: "17:00", end: "17:30", class: "BOŞ", subject: "DERS YOK" }
            ],
            "Perşembe": [
                { period: 1, start: "12:50", end: "13:20", class: "10-D", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 2, start: "13:30", end: "14:00", class: "10-D", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 3, start: "14:05", end: "14:35", class: "10-C", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 4, start: "14:40", end: "15:10", class: "10-C", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 5, start: "15:15", end: "15:45", class: "11-B", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 6, start: "15:50", end: "16:20", class: "11-B", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 7, start: "16:25", end: "16:55", class: "10-F", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 8, start: "17:00", end: "17:30", class: "10-F", subject: "GÖRSEL SANATLAR (GRS1)" }
            ],
            "Cuma": [
                { period: 1, start: "12:50", end: "13:20", class: "10-B", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 2, start: "13:30", end: "14:00", class: "10-B", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 3, start: "14:05", end: "14:35", class: "11-D", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 4, start: "14:40", end: "15:10", class: "11-D", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 5, start: "15:15", end: "15:45", class: "10-E", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 6, start: "15:50", end: "16:20", class: "10-E", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 7, start: "16:25", end: "16:55", class: "11-A", subject: "GÖRSEL SANATLAR (GRS1)" },
                { period: 8, start: "17:00", end: "17:30", class: "11-A", subject: "GÖRSEL SANATLAR (GRS1)" }
            ]
        };

        const daysKeys = Object.keys(schedule);
        let currentDayIndex = 0;
        let isWeekend = false;

        function initSystem() {
            const now = new Date();
            const dayOfWeek = now.getDay(); // 0: Pazar, 1: Pzt, ..., 6: Cmt

            if (dayOfWeek === 0 || dayOfWeek === 6) {
                isWeekend = true;
            } else {
                currentDayIndex = dayOfWeek - 1; // Pzt: 1 -> 0
                isWeekend = false;
            }
            renderSchedule();
        }

        function changeDay(direction) {
            isWeekend = false; // Manuel geçişte hafta sonu modundan çık
            currentDayIndex += direction;
            if (currentDayIndex < 0) currentDayIndex = daysKeys.length - 1;
            if (currentDayIndex >= daysKeys.length) currentDayIndex = 0;
            renderSchedule();
        }

        function renderSchedule() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            
            if (isWeekend) {
                document.getElementById('current-day-title').innerText = "HAFTA SONU";
                container.innerHTML = `<div class="weekend-msg">OKUL YOK / HAFTA SONU</div>`;
                return;
            }

            const dayName = daysKeys[currentDayIndex];
            document.getElementById('current-day-title').innerText = dayName.toUpperCase();
            
            const now = new Date();
            const currentTimeMinutes = now.getHours() * 60 + now.getMinutes();
            const isToday = (now.getDay() === (currentDayIndex + 1));

            schedule[dayName].forEach((lesson, i) => {
                const card = document.createElement('div');
                card.className = 'slot-card';
                
                const startMin = lesson.start.split(':').map(Number);
                const startMinutes = startMin[0] * 60 + startMin[1];
                const endMin = lesson.end.split(':').map(Number);
                const endMinutes = endMin[0] * 60 + endMin[1];

                if (isToday && currentTimeMinutes >= startMinutes && currentTimeMinutes <= endMinutes) {
                    card.classList.add('active-lesson');
                }

                card.innerHTML = `<div class="slot-time">${lesson.start} - ${lesson.end}</div>
                                  <div class="slot-info"><div class="slot-class">${lesson.class}</div>
                                  <div class="slot-desc">${lesson.subject}</div></div>`;
                container.appendChild(card);

                // Tenefüs
                if (i < schedule[dayName].length - 1) {
                    const nextLesson = schedule[dayName][i + 1];
                    const nextStartMin = nextLesson.start.split(':').map(Number);
                    const nextStartMinutes = nextStartMin[0] * 60 + nextStartMin[1];

                    if (endMinutes < nextStartMinutes) {
                        const breakCard = document.createElement('div');
                        breakCard.className = 'slot-card break-time';
                        if (isToday && currentTimeMinutes > endMinutes && currentTimeMinutes < nextStartMinutes) {
                             breakCard.style.border = "2px solid var(--accent-amber)";
                        }
                        breakCard.innerHTML = `<div class="slot-time">${lesson.end} - ${nextLesson.start}</div>
                                               <div class="slot-info"><div class="slot-class">TENEFÜS</div></div>`;
                        container.appendChild(breakCard);
                    }
                }
            });
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR');
        }

        initSystem();
        setInterval(updateClock, 1000);
        setInterval(renderSchedule, 60000); // 1 dakikada bir günceller
    </script>
</body>
</html>
