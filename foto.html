<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Okul Fotoğraf Çekim Asistanı</title>
    <!-- Tailwind CSS ve FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .aspect-eokul { aspect-ratio: 3 / 4; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Üst Başlık -->
    <header class="bg-slate-800 border-b border-slate-700 py-2.5 px-4 text-center shadow-md">
        <h1 class="text-sm font-bold tracking-wide flex items-center justify-center gap-2">
            <i class="fa-solid fa-camera-retro text-indigo-400"></i> e-Okul Hızlı Fotoğraf Çekim Asistanı
        </h1>
    </header>

    <!-- Ana Ekran (Tek Sayfa / Kaydırmasız Düzen) -->
    <main class="flex-1 max-w-md w-full mx-auto p-3 flex flex-col justify-center gap-3">
        
        <!-- Canlı Kamera Kutusu ve Kılavuz -->
        <div class="relative w-full aspect-eokul bg-black rounded-xl overflow-hidden border-2 border-slate-700 shadow-xl flex items-center justify-center">
            <video id="videoElement" autoplay playsinline class="w-full h-full object-cover"></video>
            
            <!-- e-Okul Baş/Omuz Kadraj Rehberi -->
            <div class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center p-4">
                <div class="w-40 h-56 border-2 border-dashed border-amber-400/90 rounded-full flex flex-col items-center justify-center relative shadow-2xl">
                    <span class="absolute -top-6 bg-black/70 text-amber-300 text-[9px] px-2 py-0.5 rounded border border-amber-500/30 font-mono">e-Okul Kadraj</span>
                    <div class="w-2.5 h-2.5 border-t-2 border-l-2 border-amber-400/90 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
                </div>
            </div>

            <!-- Kamera Kapalı Durumu -->
            <div id="cameraOffMessage" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center text-slate-400 text-center p-4">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-indigo-500"></i>
                <p class="text-xs font-medium">Kamera açılıyor...</p>
            </div>
        </div>

        <!-- Kamera Altı Bilgi Girişleri ve Çekim Kontrolleri -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-3.5 shadow-lg space-y-2.5">
            
            <!-- Sınıf ve Numara (Yanyana) -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Sınıf</label>
                    <input type="text" id="classNameInput" placeholder="Örn: 5-A" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Öğrenci No</label>
                    <input type="text" id="studentNoInput" placeholder="Örn: 105" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- Ad Soyad -->
            <div>
                <label class="block text-[11px] font-medium text-slate-300 mb-1">Öğrenci Adı Soyadı</label>
                <input type="text" id="studentNameInput" placeholder="Örn: Ahmet YILMAZ" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Çek Butonu -->
            <button onclick="capturePhoto()" id="captureBtn" disabled
                class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white py-2.5 rounded-lg font-bold transition flex items-center justify-center gap-2 shadow-md text-sm mt-1">
                <i class="fa-solid fa-camera"></i> FOTOĞRAFI ÇEK & KAYDET
            </button>
        </div>

    </main>

    <!-- Gizli İşlem Canvası (133x171 Standart) -->
    <canvas id="processingCanvas" width="133" height="171" class="hidden"></canvas>

    <script>
        let stream = null;
        const videoElement = document.getElementById('videoElement');
        const captureBtn = document.getElementById('captureBtn');
        const cameraOffMessage = document.getElementById('cameraOffMessage');
        const processingCanvas = document.getElementById('processingCanvas');

        // Sayfa açıldığı an arka kamerayı otomatik başlat
        window.addEventListener('DOMContentLoaded', () => {
            startBackCamera();
        });

        async function startBackCamera() {
            try {
                const constraints = {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: { exact: 'environment' }
                    }
                };

                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    // Cihaz 'exact' desteklemiyorsa genel arka kamera moduna geç
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'environment' }
                    });
                }

                videoElement.srcObject = stream;
                cameraOffMessage.style.display = 'none';
                captureBtn.disabled = false;
            } catch (err) {
                console.error("Kamera hatası:", err);
                alert("Arka kamera açılamadı. Lütfen tarayıcı kamera izinlerini kontrol edin.");
            }
        }

        // Fotoğraf Çekme ve Max 120 KB Kalite Zorlama Algoritması
        function capturePhoto() {
            if (!stream) {
                alert("Kamera aktif değil!");
                return;
            }
            const className = document.getElementById('classNameInput').value.trim();
            const studentNo = document.getElementById('studentNoInput').value.trim();
            const studentName = document.getElementById('studentNameInput').value.trim();

            if (!className) {
                alert("Lütfen sınıf adını giriniz (Örn: 5-A)");
                document.getElementById('classNameInput').focus();
                return;
            }
            if (!studentNo || !studentName) {
                alert("Lütfen öğrenci numarasını ve adını soyadını giriniz!");
                document.getElementById('studentNoInput').focus();
                return;
            }

            const ctx = processingCanvas.getContext('2d');
            const vWidth = videoElement.videoWidth;
            const vHeight = videoElement.videoHeight;

            // 3:4 Kadraj Kırpma
            let cropWidth = vHeight * (3 / 4);
            let cropHeight = vHeight;
            if (cropWidth > vWidth) {
                cropWidth = vWidth;
                cropHeight = vWidth * (4 / 3);
            }
            const startX = (vWidth - cropWidth) / 2;
            const startY = (vHeight - cropHeight) / 2;

            ctx.drawImage(videoElement, startX, startY, cropWidth, cropHeight, 0, 0, 133, 171);

            // 120 KB Sınırını Zorlayan Kalite Optimizasyonu
            let quality = 0.95;
            let dataUrl = processingCanvas.toDataURL('image/jpeg', quality);
            let blob = dataURItoBlob(dataUrl);

            while (blob.size > 120 * 1024 && quality > 0.1) {
                quality -= 0.02;
                dataUrl = processingCanvas.toDataURL('image/jpeg', quality);
                blob = dataURItoBlob(dataUrl);
            }

            const sanitizedName = studentName.replace(/[\s\/\\:*?"<>|]/g, "_");
            const filename = `${studentNo} ${sanitizedName}.jpg`;

            // Otomatik İndirme
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // Formu sonraki öğrenci için temizle (Sınıf sabit kalır, numara/ad temizlenir)
            document.getElementById('studentNoInput').value = "";
            document.getElementById('studentNameInput').value = "";
            document.getElementById('studentNoInput').focus();
        }

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }
    </script>
</body>
</html>
