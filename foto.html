<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Okul Hızlı Fotoğraf Çekim Asistanı</title>
    <!-- Tailwind CSS ve FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .aspect-eokul { aspect-ratio: 3 / 4; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans overflow-hidden">

    <!-- Üst Başlık -->
    <header class="bg-slate-800 border-b border-slate-700 py-1.5 px-3 text-center shadow-md shrink-0">
        <h1 class="text-xs font-bold tracking-wide flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-camera-retro text-indigo-400"></i> e-Okul Fotoğraf Çekim Asistanı (133x171 px)
        </h1>
    </header>

    <!-- Ana Ekran (Tek Sayfa / Ultra Kompakt Düzen) -->
    <main class="flex-1 max-w-sm w-full mx-auto p-2 flex flex-col justify-center gap-2">
        
        <!-- Küçültülmüş Canlı Kamera Kutusu ve Kılavuz -->
        <div class="relative w-20 aspect-eokul bg-black rounded-md overflow-hidden border border-slate-700 shadow-lg mx-auto flex items-center justify-center shrink-0">
            <video id="videoElement" autoplay playsinline class="w-full h-full object-cover"></video>
            
            <!-- e-Okul Kadraj Rehberi -->
            <div class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center p-1">
                <div class="w-14 h-20 border border-dashed border-amber-400/90 rounded-full flex flex-col items-center justify-center relative shadow-md">
                    <span class="absolute -top-3 bg-black/80 text-amber-300 text-[5px] px-1 py-0 rounded font-mono">e-Okul</span>
                    <div class="w-1 h-1 border-t border-l border-amber-400/90 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
                </div>
            </div>

            <!-- Kamera Kapalı Durumu -->
            <div id="cameraOffMessage" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center text-slate-400 text-center p-1">
                <i class="fa-solid fa-spinner fa-spin text-lg mb-0.5 text-indigo-500"></i>
                <p class="text-[8px] font-medium">Açılıyor...</p>
            </div>
        </div>

        <!-- Bilgi Girişleri ve Çekim Kontrolleri -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-2.5 shadow-lg space-y-2 shrink-0">
            
            <!-- Sınıf Adı ve Klasör Oluştur Butonu Yanyana -->
            <div>
                <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Sınıf Adı ve Klasör</label>
                <div class="flex gap-1.5">
                    <input type="text" id="classNameInput" placeholder="Örn: 5-A" 
                        class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
                    <button onclick="createClassFolder()" id="folderBtn" 
                        class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition shrink-0 flex items-center gap-1 shadow">
                        <i class="fa-solid fa-folder-plus"></i> Klasör Oluştur
                    </button>
                </div>
            </div>

            <!-- Öğrenci No ve Ad Soyad -->
            <div class="grid grid-cols-3 gap-1.5">
                <div class="col-span-1">
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Öğrenci No</label>
                    <input type="text" id="studentNoInput" placeholder="105" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
                </div>
                <div class="col-span-2">
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Öğrenci Adı Soyadı</label>
                    <input type="text" id="studentNameInput" placeholder="Ahmet YILMAZ" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- Çek Butonu -->
            <button onclick="capturePhoto()" id="captureBtn" disabled
                class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white py-2 rounded-lg font-bold transition flex items-center justify-center gap-1.5 shadow-md text-xs mt-0.5">
                <i class="fa-solid fa-camera"></i> FOTOĞRAFI ÇEK & KAYDET
            </button>
        </div>

    </main>

    <!-- Gizli İşlem Canvası (133x171 Standart) -->
    <canvas id="processingCanvas" width="133" height="171" class="hidden"></canvas>

    <script>
        let stream = null;
        let rootDirectoryHandle = null;
        let activeClassDirHandle = null;
        let activeClassName = "";

        const videoElement = document.getElementById('videoElement');
        const captureBtn = document.getElementById('captureBtn');
        const cameraOffMessage = document.getElementById('cameraOffMessage');
        const processingCanvas = document.getElementById('processingCanvas');

        // Sayfa açıldığı an arka kamerayı otomatik başlat
        window.addEventListener('DOMContentLoaded', () => {
            startBackCamera();
        });

        async function startBackCamera() {
            try {
                const constraints = {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: { exact: 'environment' }
                    }
                };

                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'environment' }
                    });
                }

                videoElement.srcObject = stream;
                cameraOffMessage.style.display = 'none';
                captureBtn.disabled = false;
            } catch (err) {
                console.error("Kamera hatası:", err);
                alert("Arka kamera açılamadı. Lütfen tarayıcı kamera izinlerini kontrol edin.");
            }
        }

        // Sınıf Klasörü Oluşturma / Seçme
        async function createClassFolder() {
            const inputVal = document.getElementById('classNameInput').value.trim();
            if (!inputVal) {
                alert("Lütfen önce sınıf adını yazın (Örn: 5-A)");
                document.getElementById('classNameInput').focus();
                return;
            }
            const className = inputVal.replace(/[\s\/\\:*?"<>|]/g, "_");

            try {
                if (!window.showDirectoryPicker) {
                    alert("Tarayıcınız doğrudan klasör oluşturmayı desteklemiyor. Fotoğraflar indirilenler klasörüne inecek.");
                    activeClassName = className;
                    updateFolderButtonState(className, true);
                    return;
                }

                // İlk kez klasör oluşturuluyorsa ana kayıt klasörü seçtirilir
                if (!rootDirectoryHandle) {
                    alert("Fotoğrafların toplanacağı ANA KLASÖRÜ seçin (Sınıf klasörü bunun altında açılacak).");
                    rootDirectoryHandle = await window.showDirectoryPicker();
                }

                // Seçilen ana klasör altında sınıf adıyla alt klasör oluştur
                activeClassDirHandle = await rootDirectoryHandle.getDirectoryHandle(className, { create: true });
                activeClassName = className;
                updateFolderButtonState(className, true);
                alert(`"${className}" sınıf klasörü başarıyla oluşturuldu! Tüm çekimler bu klasöre kaydedilecek.`);

            } catch (err) {
                console.error("Klasör oluşturma hatası:", err);
                alert("Klasör oluşturma iptal edildi veya hata oluştu.");
            }
        }

        function updateFolderButtonState(className, isReady) {
            const btn = document.getElementById('folderBtn');
            if (isReady) {
                btn.innerHTML = `<i class="fa-solid fa-check"></i> ${className} Hazır`;
                btn.className = "bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition shrink-0 flex items-center gap-1 shadow";
            }
        }

        // Fotoğraf Çekme ve Sınıf Klasörüne Kaydetme
        async function capturePhoto() {
            if (!stream) {
                alert("Kamera aktif değil!");
                return;
            }

            const inputVal = document.getElementById('classNameInput').value.trim();
            if (!inputVal) {
                alert("Lütfen sınıf adını giriniz!");
                document.getElementById('classNameInput').focus();
                return;
            }

            const className = inputVal.replace(/[\s\/\\:*?"<>|]/g, "_");
            
            // Sınıf ismi yazılıp klasör oluşturulmadıysa otomatik oluştur
            if (className !== activeClassName || !activeClassDirHandle) {
                document.getElementById('classNameInput').value = className;
                await createClassFolder();
            }

            const studentNo = document.getElementById('studentNoInput').value.trim();
            const studentName = document.getElementById('studentNameInput').value.trim();

            if (!studentNo || !studentName) {
                alert("Lütfen öğrenci numarasını ve adını soyadını giriniz!");
                document.getElementById('studentNoInput').focus();
                return;
            }

            const ctx = processingCanvas.getContext('2d');
            const vWidth = videoElement.videoWidth;
            const vHeight = videoElement.videoHeight;

            // 3:4 Kadraj Kırpma
            let cropWidth = vHeight * (3 / 4);
            let cropHeight = vHeight;
            if (cropWidth > vWidth) {
                cropWidth = vWidth;
                cropHeight = vWidth * (4 / 3);
            }
            const startX = (vWidth - cropWidth) / 2;
            const startY = (vHeight - cropHeight) / 2;

            ctx.drawImage(videoElement, startX, startY, cropWidth, cropHeight, 0, 0, 133, 171);

            // 120 KB Sınırını Zorlayan Kalite Optimizasyonu
            let quality = 0.95;
            let dataUrl = processingCanvas.toDataURL('image/jpeg', quality);
            let blob = dataURItoBlob(dataUrl);

            while (blob.size > 120 * 1024 && quality > 0.1) {
                quality -= 0.02;
                dataUrl = processingCanvas.toDataURL('image/jpeg', quality);
                blob = dataURItoBlob(dataUrl);
            }

            const sanitizedName = studentName.replace(/[\s\/\\:*?"<>|]/g, "_");
            const filename = `${studentNo} ${sanitizedName}.jpg`;

            // Doğrudan sınıf klasörüne kaydet
            if (activeClassDirHandle) {
                try {
                    const fileHandle = await activeClassDirHandle.getFileHandle(filename, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                } catch (err) {
                    console.error("Klasöre yazma hatası, indiriliyor:", err);
                    fallbackDownload(dataUrl, filename);
                }
            } else {
                fallbackDownload(dataUrl, filename);
            }

            // Sınıf ve klasör sabit kalır, sonraki öğrenci için numara ve ad temizlenir
            document.getElementById('studentNoInput').value = "";
            document.getElementById('studentNameInput').value = "";
            document.getElementById('studentNoInput').focus();
        }

        function fallbackDownload(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }
    </script>
</body>
</html>
