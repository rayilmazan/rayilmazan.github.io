<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Okul Hızlı Fotoğraf Çekim Asistanı</title>
    <!-- Tailwind CSS ve FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .aspect-eokul { aspect-ratio: 3 / 4; }
        .capitalize-words { text-transform: capitalize; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans overflow-hidden">

    <!-- Üst Başlık -->
    <header class="bg-slate-800 border-b border-slate-700 py-1.5 px-3 text-center shadow-md shrink-0">
        <h1 class="text-xs font-bold tracking-wide flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-camera-retro text-indigo-400"></i> e-Okul Fotoğraf Çekim Asistanı (133x171 px)
        </h1>
    </header>

    <!-- ANA İÇERİK (SAYFA GEÇİŞLERİ) -->
    <main class="flex-1 max-w-sm w-full mx-auto p-3 flex flex-col justify-center">
        
        <!-- ================= 1. SAYFA: BİLGİ GİRİŞ EKRANI ================= -->
        <div id="infoScreen" class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg space-y-3">
            <div class="text-center pb-1 border-b border-slate-700">
                <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">1. Öğrenci Bilgileri</h2>
            </div>

            <!-- Sınıf Adı ve Klasör Oluştur -->
            <div>
                <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Sınıf Adı ve Klasör</label>
                <div class="flex gap-1.5">
                    <input type="text" id="classNameInput" placeholder="Örn: 5-A" 
                        class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
                    <button onclick="createClassFolder()" id="folderBtn" 
                        class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition shrink-0 flex items-center gap-1 shadow">
                        <i class="fa-solid fa-folder-plus"></i> Klasör Oluştur
                    </button>
                </div>
            </div>

            <!-- Öğrenci No (Sadece Rakam Klavyesi) -->
            <div>
                <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Öğrenci Numarası</label>
                <input type="text" id="studentNoInput" inputmode="numeric" pattern="[0-9]*" placeholder="Örn: 105" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Öğrenci Ad Soyad (İlk Harfler Büyük) -->
            <div>
                <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Öğrenci Adı Soyadı</label>
                <input type="text" id="studentNameInput" autocapitalize="words" placeholder="Örn: Ahmet Yılmaz" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-indigo-500 capitalize-words">
            </div>

            <!-- Kamera Ekranına Geçiş Butonu -->
            <button onclick="goToCameraScreen()" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg font-bold transition flex items-center justify-center gap-1.5 shadow-md text-xs mt-2">
                <i class="fa-solid fa-arrow-right"></i> KAMERA EKRANINA GEÇ
            </button>
        </div>


        <!-- ================= 2. SAYFA: KAMERA VE ÇEKİM EKRANI ================= -->
        <div id="cameraScreen" class="hidden flex flex-col items-center gap-3">
            
            <!-- Aktif Öğrenci Bilgi Özeti -->
            <div class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-center text-xs shadow">
                <span class="text-indigo-400 font-semibold" id="displayClassInfo">-</span> | 
                <span class="text-emerald-300 font-bold" id="displayStudentInfo">-</span>
            </div>

            <!-- Küçültülmüş Canlı Kamera Kutusu ve Kılavuz -->
            <div class="relative w-24 aspect-eokul bg-black rounded-md overflow-hidden border border-slate-700 shadow-xl mx-auto flex items-center justify-center shrink-0">
                <video id="videoElement" autoplay playsinline class="w-full h-full object-cover"></video>
                
                <!-- e-Okul Kadraj Rehberi -->
                <div class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center p-1">
                    <div class="w-16 h-22 border border-dashed border-amber-400/90 rounded-full flex flex-col items-center justify-center relative shadow-md">
                        <span class="absolute -top-3 bg-black/80 text-amber-300 text-[5px] px-1 py-0 rounded font-mono">e-Okul</span>
                        <div class="w-1 h-1 border-t border-l border-amber-400/90 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
                    </div>
                </div>

                <!-- Kamera Kapalı Durumu -->
                <div id="cameraOffMessage" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center text-slate-400 text-center p-1">
                    <i class="fa-solid fa-spinner fa-spin text-lg mb-0.5 text-indigo-500"></i>
                    <p class="text-[8px] font-medium">Açılıyor...</p>
                </div>
            </div>

            <!-- Çekim ve Geri Dönüş Kontrolleri -->
            <div class="w-full space-y-2">
                <button onclick="capturePhoto()" id="captureBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-lg font-bold transition flex items-center justify-center gap-1.5 shadow-md text-xs">
                    <i class="fa-solid fa-camera"></i> FOTOĞRAFI ÇEK & KAYDET
                </button>
                <button onclick="backToInfoScreen()" 
                    class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 py-1.5 rounded-lg font-medium transition flex items-center justify-center gap-1.5 text-xs">
                    <i class="fa-solid fa-arrow-left"></i> Bilgi Ekranına Geri Dön
                </button>
            </div>
        </div>

    </main>

    <!-- Gizli İşlem Canvası (133x171 Standart) -->
    <canvas id="processingCanvas" width="133" height="171" class="hidden"></canvas>

    <script>
        let stream = null;
        let rootDirectoryHandle = null;
        let activeClassDirHandle = null;
        let activeClassName = "";
        let currentStudentNo = "";
        let currentStudentName = "";

        const videoElement = document.getElementById('videoElement');
        const cameraOffMessage = document.getElementById('cameraOffMessage');
        const processingCanvas = document.getElementById('processingCanvas');

        // Sayfa açıldığında arka kamerayı arka planda hazırla
        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
        });

        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: { exact: 'environment' }
                    }
                };
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'environment' }
                    });
                }
                videoElement.srcObject = stream;
                cameraOffMessage.style.display = 'none';
            } catch (err) {
                console.error("Kamera hatası:", err);
            }
        }

        // Sınıf Klasörü Oluşturma / Seçme
        async function createClassFolder() {
            const inputVal = document.getElementById('classNameInput').value.trim();
            if (!inputVal) {
                alert("Lütfen önce sınıf adını yazın (Örn: 5-A)");
                document.getElementById('classNameInput').focus();
                return;
            }
            const className = inputVal.replace(/[\s\/\\:*?"<>|]/g, "_");

            try {
                if (!window.showDirectoryPicker) {
                    alert("Tarayıcınız doğrudan klasör oluşturmayı desteklemiyor. Fotoğraflar indirilenler klasörüne inecek.");
                    activeClassName = className;
                    updateFolderButtonState(className, true);
                    return;
                }

                if (!rootDirectoryHandle) {
                    alert("Fotoğrafların toplanacağı ANA KLASÖRÜ seçin (Sınıf klasörü bunun altında açılacak).");
                    rootDirectoryHandle = await window.showDirectoryPicker();
                }

                activeClassDirHandle = await rootDirectoryHandle.getDirectoryHandle(className, { create: true });
                activeClassName = className;
                updateFolderButtonState(className, true);
                alert(`"${className}" sınıf klasörü başarıyla oluşturuldu!`);

            } catch (err) {
                console.error("Klasör hatası:", err);
            }
        }

        function updateFolderButtonState(className, isReady) {
            const btn = document.getElementById('folderBtn');
            if (isReady) {
                btn.innerHTML = `<i class="fa-solid fa-check"></i> ${className} Hazır`;
                btn.className = "bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition shrink-0 flex items-center gap-1 shadow";
            }
        }

        // Bilgi Ekranından Kamera Ekranına Geçiş
        async function goToCameraScreen() {
            const inputVal = document.getElementById('classNameInput').value.trim();
            const studentNo = document.getElementById('studentNoInput').value.trim();
            const studentName = document.getElementById('studentNameInput').value.trim();

            if (!inputVal) {
                alert("Lütfen sınıf adını giriniz!");
                document.getElementById('classNameInput').focus();
                return;
            }
            if (!studentNo || !studentName) {
                alert("Lütfen öğrenci numarasını ve adını soyadını giriniz!");
                document.getElementById('studentNoInput').focus();
                return;
            }

            const className = inputVal.replace(/[\s\/\\:*?"<>|]/g, "_");
            
            // Sınıf klasörü henüz oluşturulmadıysa otomatik oluştur/bağlan
            if (className !== activeClassName || !activeClassDirHandle) {
                activeClassName = className;
                if (window.showDirectoryPicker && rootDirectoryHandle) {
                    try {
                        activeClassDirHandle = await rootDirectoryHandle.getDirectoryHandle(className, { create: true });
                    } catch(e) {}
                }
            }

            currentStudentNo = studentNo;
            currentStudentName = studentName;

            // Üst bilgi özetini güncelle
            document.getElementById('displayClassInfo').textContent = `Sınıf: ${activeClassName}`;
            document.getElementById('displayStudentInfo').textContent = `${studentNo} - ${studentName}`;

            // Ekranları değiştir
            document.getElementById('infoScreen').classList.add('hidden');
            document.getElementById('cameraScreen').classList.remove('hidden');
        }

        // Kamera Ekranından Bilgi Ekranına Geri Dönüş
        function backToInfoScreen() {
            document.getElementById('cameraScreen').classList.add('hidden');
            document.getElementById('infoScreen').classList.remove('hidden');
            // Numara ve adı temizle, sonraki öğrenci için numaraya odaklan
            document.getElementById('studentNoInput').value = "";
            document.getElementById('studentNameInput').value = "";
            document.getElementById('studentNoInput').focus();
        }

        // Fotoğraf Çekme ve Klasöre Kaydetme
        async function capturePhoto() {
            if (!stream) {
                alert("Kamera aktif değil!");
                return;
            }

            const ctx = processingCanvas.getContext('2d');
            const vWidth = videoElement.videoWidth;
            const vHeight = videoElement.videoHeight;

            // 3:4 Kadraj Kırpma
            let cropWidth = vHeight * (3 / 4);
            let cropHeight = vHeight;
            if (cropWidth > vWidth) {
                cropWidth = vWidth;
                cropHeight = vWidth * (4 / 3);
            }
            const startX = (vWidth - cropWidth) / 2;
            const startY = (vHeight - cropHeight) / 2;

            ctx.drawImage(videoElement, startX, startY, cropWidth, cropHeight, 0, 0, 133, 171);

            // 120 KB Sınırını Zorlayan Kalite Optimizasyonu
            let quality = 0.95;
            let dataUrl = processingCanvas.toDataURL('image/jpeg', quality);
            let blob = dataURItoBlob(dataUrl);

            while (blob.size > 120 * 1024 && quality > 0.1) {
                quality -= 0.02;
                dataUrl = processingCanvas.toDataURL('image/jpeg', quality);
                blob = dataURItoBlob(dataUrl);
            }

            const sanitizedName = currentStudentName.replace(/[\s\/\\:*?"<>|]/g, "_");
            const filename = `${currentStudentNo} ${sanitizedName}.jpg`;

            // Kayıt İşlemi
            if (activeClassDirHandle) {
                try {
                    const fileHandle = await activeClassDirHandle.getFileHandle(filename, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                } catch (err) {
                    fallbackDownload(dataUrl, filename);
                }
            } else {
                fallbackDownload(dataUrl, filename);
            }

            // ÇEKİM BAŞARIYLA TAMAMLANDI -> OTOMATİK BİLGİ EKRANINA DÖN
            backToInfoScreen();
        }

        function fallbackDownload(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }
    </script>
</body>
</html>
