<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID_GEN_UNIT // Yaka Kartı Jeneratörü</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      /* Rusted silver / Used Future Aesthetic */
      --bg-dark: #121415;
      --panel-bg: #1e2226;
      --accent: #d97706; /* Rusted orange */
      --accent-hover: #b45309;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(0deg, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(90deg, #1a1d21, #121415);
      padding: 16px 24px;
      border-bottom: 2px solid var(--border);
      border-bottom-color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 { font-size: 1.25rem; font-weight: 700; color: #cbd5e1; display: flex; align-items: center; gap: 8px; text-transform: uppercase; font-family: monospace; letter-spacing: 1px; }
    header .sub-info { font-size: 0.85rem; color: var(--text-muted); font-family: monospace; }

    .app-container {
      display: flex;
      flex: 1;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 900px) {
      .app-container { flex-direction: column; }
    }

    .controls-panel, .preview-panel {
      background: var(--panel-bg);
      border: 1px solid #334155;
      border-top: 2px solid #64748b;
      border-left: 2px solid #64748b;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5);
      border-radius: 4px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }
    
    /* Greebles */
    .controls-panel::before, .preview-panel::before {
      content: ''; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: #0f172a; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2);
    }
    .controls-panel::after, .preview-panel::after {
      content: ''; position: absolute; bottom: 6px; left: 6px; width: 6px; height: 6px; border-radius: 50%; background: #0f172a; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2);
    }

    .controls-panel { flex: 1; }
    .preview-panel { flex: 1; align-items: center; justify-content: center; }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      font-family: monospace;
    }

    .template-grid, .person-grid {
      display: grid;
      gap: 8px;
    }
    
    .template-grid { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
    .person-grid { grid-template-columns: repeat(4, 1fr); margin-bottom: 5px; }

    .btn-grid-item {
      background: #0f141a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
      font-family: monospace;
    }

    .btn-grid-item:hover { border-color: var(--text-muted); }

    .btn-grid-item.active {
      border-color: var(--accent);
      background: #451a03;
      color: #fff;
      box-shadow: 0 0 10px rgba(217, 119, 6, 0.3);
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; font-family: monospace; }
    
    .form-input {
      background: #0f141a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .form-input:focus { border-color: var(--accent); }

    .file-input-wrapper {
      position: relative;
      background: #0f141a;
      border: 2px dashed var(--border);
      border-radius: 4px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .file-input-wrapper:hover { border-color: var(--accent); }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .photo-controls-box {
      background: #0f141a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .photo-controls-row { display: flex; align-items: center; gap: 10px; }
    .photo-controls-row label { font-size: 0.78rem; color: var(--text-muted); width: 70px; font-family: monospace; }
    .photo-controls-row input[type="range"] { flex: 1; accent-color: var(--accent); }

    .btn-auto-face {
      background: #1f2937;
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
      font-family: monospace;
    }
    .btn-auto-face:hover { background: #374151; }

    .btn-submit {
      background: var(--accent);
      color: white;
      border: 1px solid #f59e0b;
      padding: 14px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
      font-family: monospace;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
    }
    .btn-submit:hover { background: var(--accent-hover); }

    .card-preview-container {
      width: 330px;
      height: 465px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    #cardCanvas { width: 100%; height: 100%; }

    .badge-info-tag {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--accent);
      background: rgba(217, 119, 6, 0.1);
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid rgba(217, 119, 6, 0.2);
      font-family: monospace;
    }

    .sys-footer {
      text-align: right;
      padding: 10px 24px;
      font-family: monospace;
      color: #475569;
      font-size: 0.85rem;
      border-top: 1px solid #1f2937;
      background: #0f141a;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ ID_GEN_UNIT</h1>
    <span class="sub-info">A4 YATAY • 8 KART • ÇİFT SAYFA PDF</span>
  </header>

  <div class="app-container">
    
    <!-- SOL KONTROL PANELİ -->
    <div class="controls-panel">
      
      <div class="section-title">1. Şablon Modeli</div>
      <div class="template-grid">
        <button class="btn-grid-item template-btn active" data-template="nobetci_ogrenci">Nöbetçi Öğrenci</button>
        <button class="btn-grid-item template-btn" data-template="nobetci_ogretmen">Nöbetçi Öğretmen</button>
        <button class="btn-grid-item template-btn" data-template="ogretmen">Öğretmen</button>
        <button class="btn-grid-item template-btn" data-template="ziyaretci">Ziyaretçi</button>
      </div>

      <div class="section-title" style="margin-top:10px;">2. Kişi Yönetimi (A4'e 8 Kişi)</div>
      <div class="person-grid" id="personGrid">
        <button class="btn-grid-item person-btn active" data-index="0">T-01</button>
        <button class="btn-grid-item person-btn" data-index="1">T-02</button>
        <button class="btn-grid-item person-btn" data-index="2">T-03</button>
        <button class="btn-grid-item person-btn" data-index="3">T-04</button>
        <button class="btn-grid-item person-btn" data-index="4">T-05</button>
        <button class="btn-grid-item person-btn" data-index="5">T-06</button>
        <button class="btn-grid-item person-btn" data-index="6">T-07</button>
        <button class="btn-grid-item person-btn" data-index="7">T-08</button>
      </div>

      <div class="form-group">
        <label for="inputSchool">Okul Adı (Tüm Kartlar İçin Ortak)</label>
        <input type="text" id="inputSchool" class="form-input" value="ŞEHİT ÖMER HALİSDEMİR ANADOLU İMAM HATİP LİSESİ">
      </div>

      <div class="form-group" id="groupName">
        <label for="inputName">Adı Soyadı</label>
        <input type="text" id="inputName" class="form-input" value="MUSTAFA KEMAL ATATÜRK">
      </div>

      <div class="form-group" id="groupSub">
        <label for="inputSub">Alt Bilgi (Branş / Görev / Unvan)</label>
        <input type="text" id="inputSub" class="form-input" value="BİLİŞİM TEKNOLOJİLERİ VE YAZILIM ÖĞRETMENİ">
      </div>

      <div class="form-group" id="groupPhoto">
        <label>Seçili Kişi İçin Fotoğraf Yükle</label>
        <div class="file-input-wrapper">
          <span id="fileName">📷 Fotoğraf Seç</span>
          <input type="file" id="inputPhoto" accept="image/*">
        </div>

        <div class="photo-controls-box">
          <button type="button" class="btn-auto-face" id="btnAutoFace">
            🔍 Otomatik Yüz Tespit Et & Büyüt
          </button>
          
          <div class="photo-controls-row">
            <!-- Küçültme değeri min 0.1'e düşürüldü -->
            <label>Büyüt/Küçült:</label>
            <input type="range" id="photoScale" min="0.1" max="4" step="0.02" value="1">
          </div>

          <div class="photo-controls-row">
            <label>Yatay (X):</label>
            <input type="range" id="photoOffsetX" min="-200" max="200" step="2" value="0">
          </div>

          <div class="photo-controls-row">
            <label>Dikey (Y):</label>
            <input type="range" id="photoOffsetY" min="-200" max="200" step="2" value="0">
          </div>
        </div>
      </div>

      <button class="btn-submit" id="btnDownloadPDF">
        📄 ÇOKLU PDF İNDİR (2 SAYFA)
      </button>
    </div>

    <!-- SAĞ ÖNİZLEME PANELİ -->
    <div class="preview-panel">
      <div class="section-title" style="margin-bottom: 15px; width: 100%; text-align: center;">Canlı Kart Önizlemesi</div>
      <div class="card-preview-container">
        <canvas id="cardCanvas" width="600" height="850"></canvas>
      </div>
      <div class="badge-info-tag">✂️ PDF Çıktısında 8 Kişi Tek A4'e Sığdırılır</div>
    </div>

  </div>

  <div class="sys-footer">
    system ops: rayılmazan
  </div>

  <script>
    const TEMPLATES = {
      nobetci_ogrenci: { title: "NÖBETÇİ ÖĞRENCİ", color: "#2563EB", hasPhoto: false, hasName: false, giantLetter: "N", letterPos: "center" },
      nobetci_ogretmen: { title: "NÖBETÇİ ÖĞRETMEN", color: "#EF4444", hasPhoto: true, hasName: true, giantLetter: null, letterPos: "center" },
      ogretmen: { title: "ÖĞRETMEN", color: "#06B6D4", hasPhoto: true, hasName: true, giantLetter: null, letterPos: "center" },
      ziyaretci: { title: "ZİYARETÇİ", color: "#FF4D4D", hasPhoto: false, hasName: false, giantLetter: "Z", letterPos: "center" }
    };

    let activeTemplate = "ogretmen";
    
    // 8 Kişilik Veri Hafızası
    const persons = Array.from({length: 8}, (_, i) => ({
      name: i === 0 ? 'MUSTAFA KEMAL ATATÜRK' : '',
      sub: i === 0 ? 'BİLİŞİM TEKNOLOJİLERİ VE YAZILIM ÖĞRETMENİ' : '',
      photo: null,
      scale: 1,
      offsetX: 0,
      offsetY: 0
    }));
    let activePersonIndex = 0;
    let loadedImage = null; // Ekranda aktif olan fotoğraf

    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');
    
    const inputSchool = document.getElementById('inputSchool');
    const inputName = document.getElementById('inputName');
    const inputSub = document.getElementById('inputSub');
    const inputPhoto = document.getElementById('inputPhoto');
    const photoScale = document.getElementById('photoScale');
    const photoOffsetX = document.getElementById('photoOffsetX');
    const photoOffsetY = document.getElementById('photoOffsetY');
    const btnAutoFace = document.getElementById('btnAutoFace');

    const groupName = document.getElementById('groupName');
    const groupSub = document.getElementById('groupSub');
    const groupPhoto = document.getElementById('groupPhoto');
    const btnDownloadPDF = document.getElementById('btnDownloadPDF');

    // Şablon Değiştirme
    document.querySelectorAll('.template-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTemplate = btn.dataset.template;
        updateFormVisibility();
        renderCard();
      });
    });

    // Kişi Sekmesi Değiştirme
    document.querySelectorAll('.person-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        // Yeni kişiye geç
        activePersonIndex = parseInt(e.target.dataset.index);
        
        document.querySelectorAll('.person-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        
        // Formu yeni kişinin verileriyle doldur
        const p = persons[activePersonIndex];
        inputName.value = p.name;
        inputSub.value = p.sub;
        photoScale.value = p.scale;
        photoOffsetX.value = p.offsetX;
        photoOffsetY.value = p.offsetY;
        loadedImage = p.photo;
        
        document.getElementById('fileName').textContent = loadedImage ? "📷 FOTOĞRAF HAZIR" : "📷 FOTOĞRAF SEÇ";
        renderCard();
      });
    });

    function updateFormVisibility() {
      const config = TEMPLATES[activeTemplate];
      groupPhoto.style.display = config.hasPhoto ? 'flex' : 'none';
      groupName.style.display = config.hasName ? 'flex' : 'none';
      groupSub.style.display = config.hasName ? 'flex' : 'none';
    }

    // Inputları Veritabanına (persons array) kaydetme
    const saveState = () => {
      const p = persons[activePersonIndex];
      p.name = inputName.value;
      p.sub = inputSub.value;
      p.scale = parseFloat(photoScale.value);
      p.offsetX = parseFloat(photoOffsetX.value);
      p.offsetY = parseFloat(photoOffsetY.value);
    };

    [inputSchool, inputName, inputSub, photoScale, photoOffsetX, photoOffsetY].forEach(el => {
      el.addEventListener('input', () => {
        saveState();
        renderCard();
      });
    });

    inputPhoto.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('fileName').textContent = file.name;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            loadedImage = img;
            persons[activePersonIndex].photo = img; // O anki kişiye kaydet
            detectAndCenterFace();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Otomatik Yüz Tespiti (Piksel Cilt Analizi)
    function detectAndCenterFace() {
      if (!loadedImage) return;

      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      const tw = 200;
      const th = Math.round((loadedImage.height / loadedImage.width) * tw);
      tempCanvas.width = tw;
      tempCanvas.height = th;

      tempCtx.drawImage(loadedImage, 0, 0, tw, th);
      const imgData = tempCtx.getImageData(0, 0, tw, th);
      const data = imgData.data;

      let totalX = 0, totalY = 0, skinCount = 0;
      let minX = tw, maxX = 0, minY = th, maxY = 0;

      for (let y = 0; y < th; y++) {
        for (let x = 0; x < tw; x++) {
          const idx = (y * tw + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];

          const isSkin = (r > 95 && g > 40 && b > 20 &&
                          (Math.max(r, g, b) - Math.min(r, g, b) > 15) &&
                          Math.abs(r - g) > 15 && r > g && r > b);

          if (isSkin) {
            totalX += x; totalY += y; skinCount++;
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
          }
        }
      }

      if (skinCount > 50) {
        const faceX = (totalX / skinCount) / tw;
        const faceY = (totalY / skinCount) / th;
        const faceBoxHeight = (maxY - minY) / th;
        
        let targetScale = 1.8 / Math.max(faceBoxHeight, 0.3);
        targetScale = Math.min(Math.max(targetScale, 0.1), 3.5);

        const offsetX = Math.round((0.5 - faceX) * 280);
        const offsetY = Math.round((0.5 - faceY) * 280);

        photoScale.value = targetScale.toFixed(2);
        photoOffsetX.value = offsetX;
        photoOffsetY.value = offsetY;
      } else {
        photoScale.value = 1.0;
        photoOffsetX.value = 0;
        photoOffsetY.value = 20;
      }

      saveState();
      renderCard();
    }

    btnAutoFace.addEventListener('click', detectAndCenterFace);

    // Otomatik Metin Sarmalama ve Ortalama
    function drawWrappedText(ctx, text, x, y, maxWidth, initialFontSize, fontColor, fontWeight = "bold", maxLines = 3) {
      text = text.trim();
      if (!text) return;

      let fontSize = initialFontSize;
      ctx.fillStyle = fontColor;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      let lines = [];
      
      while (fontSize >= 12) {
        ctx.font = `${fontWeight} ${fontSize}px Arial, sans-serif`;
        const words = text.split(/\s+/);
        lines = [];
        let currentLine = words[0] || "";

        for (let i = 1; i < words.length; i++) {
          const testLine = currentLine + " " + words[i];
          const metrics = ctx.measureText(testLine);
          if (metrics.width > maxWidth) {
            lines.push(currentLine);
            currentLine = words[i];
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) lines.push(currentLine);

        if (lines.length <= maxLines) {
          const allFit = lines.every(l => ctx.measureText(l).width <= maxWidth);
          if (allFit) break;
        }
        fontSize -= 2;
      }

      const lineHeight = fontSize * 1.2;
      const totalHeight = lines.length * lineHeight;
      const startY = y - (totalHeight / 2) + (lineHeight / 2);

      lines.forEach((line, index) => {
        ctx.fillText(line, x, startY + (index * lineHeight));
      });

      ctx.textBaseline = "alphabetic";
    }

    // Kart Çizimi
    function renderCard() {
      const config = TEMPLATES[activeTemplate];
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, w, h);

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 30;
      pCanvas.height = 30;
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = "#cbd5e1";
      pCtx.beginPath(); pCtx.arc(15, 15, 1.5, 0, Math.PI * 2); pCtx.fill();
      pCtx.strokeStyle = "rgba(203, 213, 225, 0.4)"; 
      pCtx.lineWidth = 1; pCtx.beginPath(); pCtx.moveTo(0, 30); pCtx.lineTo(30, 0); pCtx.stroke();

      const pattern = ctx.createPattern(pCanvas, 'repeat');
      ctx.fillStyle = pattern;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 2;
      ctx.strokeRect(w / 2 - 50, 15, 100, 25);
      drawWrappedText(ctx, inputSchool.value.toUpperCase() || "OKUL ADI", w / 2, 90, w - 60, 32, config.color, "bold", 2);

      if (config.giantLetter && config.letterPos === "center") {
        ctx.fillStyle = config.color;
        ctx.font = "900 380px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(config.giantLetter, w / 2, h / 2 - 20);
        ctx.textBaseline = "alphabetic";
      }

      if (config.hasPhoto) {
        const centerX = w / 2;
        const centerY = 315;
        const radius = 135;

        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius + 2, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = config.color;
        ctx.lineWidth = 12;
        ctx.stroke();
        ctx.clip();

        if (loadedImage) {
          const scale = parseFloat(photoScale.value);
          const offX = parseFloat(photoOffsetX.value);
          const offY = parseFloat(photoOffsetY.value);
          const imgW = loadedImage.width * scale;
          const imgH = loadedImage.height * scale;
          const ix = centerX - (imgW / 2) + offX;
          const iy = centerY - (imgH / 2) + offY;
          ctx.drawImage(loadedImage, ix, iy, imgW, imgH);
        } else {
          ctx.fillStyle = "#f1f5f9";
          ctx.fillRect(centerX - radius, centerY - radius, radius * 2, radius * 2);
          ctx.fillStyle = "#64748b";
          ctx.font = "bold 26px Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("FOTOĞRAF", centerX, centerY + 10);
        }
        ctx.restore();

        ctx.shadowColor = "white";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        drawWrappedText(ctx, inputName.value.toUpperCase() || "ADI SOYADI", w / 2, 515, w - 50, 38, "#000000", "bold", 2);
        drawWrappedText(ctx, inputSub.value.toUpperCase() || "ALT BİLGİ", w / 2, 595, w - 60, 26, config.color, "bold", 2);
        
        ctx.shadowColor = "transparent";
      }

      const barHeight = 170;
      const barY = h - barHeight;

      if (config.giantLetter && config.letterPos === "bottom-left") {
        ctx.save();
        const nX = 20; const nY = h - 20;
        ctx.font = "900 270px Arial, sans-serif";
        ctx.textAlign = "left";
        ctx.fillStyle = config.color;
        ctx.fillText("N", nX, nY);
        ctx.fillStyle = config.color;
        ctx.fillRect(0, barY, w, barHeight);
        ctx.beginPath(); ctx.rect(0, barY, w, barHeight); ctx.clip();
        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.fillText("N", nX, nY);
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 14;
        ctx.strokeText("N", nX, nY);
        ctx.restore();
      } else {
        ctx.fillStyle = config.color;
        ctx.fillRect(0, barY, w, barHeight);
      }

      ctx.fillStyle = "#FFFFFF";
      ctx.font = "900 58px Arial, sans-serif";
      ctx.textAlign = "center";

      const titleParts = config.title.split(" ");
      const textXShift = (config.giantLetter && config.letterPos === "bottom-left") ? 45 : 0;

      if (titleParts.length > 1) {
        ctx.fillText(titleParts[0], (w / 2) + textXShift, barY + 65);
        ctx.fillText(titleParts[1], (w / 2) + textXShift, barY + 135);
      } else {
        ctx.fillText(config.title, (w / 2) + textXShift, barY + 105);
      }
    }

    // PDF İndirme (A4 Yatay, Çift Sayfa Mantığı)
    btnDownloadPDF.addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('l', 'mm', 'a4');

      const cardW = 63;
      const cardH = 92;
      const cols = 4;
      const rows = 2;
      const gapX = 6;
      const gapY = 7;
      const startX = (297 - (cols * cardW + (cols - 1) * gapX)) / 2;
      const startY = (210 - (rows * cardH + (rows - 1) * gapY)) / 2;

      // Sayfa çizdirme fonksiyonu
      const drawPageWithTemplate = (templateKey) => {
        const tempActive = activeTemplate;
        activeTemplate = templateKey; // Şablonu geçici olarak ayarla

        for (let i = 0; i < 8; i++) {
          const r = Math.floor(i / 4);
          const c = i % 4;
          const x = startX + c * (cardW + gapX);
          const y = startY + r * (cardH + gapY);

          // Kişi verilerini geçici olarak DOM'a bas ve çiz
          const p = persons[i];
          inputName.value = p.name || "";
          inputSub.value = p.sub || "";
          photoScale.value = p.scale;
          photoOffsetX.value = p.offsetX;
          photoOffsetY.value = p.offsetY;
          loadedImage = p.photo;

          renderCard();
          
          const cardImgData = canvas.toDataURL('image/jpeg', 0.95);
          pdf.addImage(cardImgData, 'JPEG', x, y, cardW, cardH);

          // Kesim çizgileri
          pdf.setDrawColor(160, 160, 160);
          pdf.setLineWidth(0.2);
          const markLen = 3;
          pdf.line(x - markLen, y, x, y);
          pdf.line(x, y - markLen, x, y);
          pdf.line(x + cardW, y, x + cardW + markLen, y);
          pdf.line(x + cardW, y - markLen, x + cardW, y);
          pdf.line(x - markLen, y + cardH, x, y + cardH);
          pdf.line(x, y + cardH, x, y + cardH + markLen);
          pdf.line(x + cardW, y + cardH, x + cardW + markLen, y + cardH);
          pdf.line(x + cardW, y + cardH, x + cardW, y + cardH + markLen);
        }

        activeTemplate = tempActive; // Orjinal şablona geri dön
      };

      // Öğretmen / Nöbetçi Öğretmen şablonlarındaysak 2 sayfa yazdır
      if (activeTemplate === 'ogretmen' || activeTemplate === 'nobetci_ogretmen') {
        // 1. Sayfa: Öğretmenler
        drawPageWithTemplate('ogretmen');
        // 2. Sayfa: Nöbetçi Öğretmenler
        pdf.addPage();
        drawPageWithTemplate('nobetci_ogretmen');
      } else {
        // Diğer şablonlar (öğrenci/ziyaretçi) için tek sayfa
        drawPageWithTemplate(activeTemplate);
      }

      // PDF çizimi bittikten sonra arayüzü tekrar aktif kişinin verilerine döndür
      const cp = persons[activePersonIndex];
      inputName.value = cp.name;
      inputSub.value = cp.sub;
      photoScale.value = cp.scale;
      photoOffsetX.value = cp.offsetX;
      photoOffsetY.value = cp.offsetY;
      loadedImage = cp.photo;
      renderCard();

      pdf.save(`yaka_kartlari_A4.pdf`);
    });

    // İlk açılış şablonunu Öğretmen'e ayarlıyoruz
    document.querySelector('.template-btn[data-template="ogretmen"]').click();
  </script>
</body>
</html>
