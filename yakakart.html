<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nöbetçi Öğretmen Çizelgesi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #1e293b;
        }

        header p {
            color: #64748b;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            header h1 {
                font-size: 1.4rem;
            }

            th, td {
                padding: 10px 8px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Nöbetçi Öğretmen Çizelgesi</h1>
        <p>Günlük Güncel Nöbet Listesi</p>
    </header>

    <main class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Nöbet Yeri</th>
                    <th>Öğretmen Adı Soyadı</th>
                    <th>Durum</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Bahçe / Ana Giriş</td>
                    <td>—</td>
                    <td>Aktif</td>
                </tr>
                <tr>
                    <td>1. Kat Koridoru</td>
                    <td>—</td>
                    <td>Aktif</td>
                </tr>
                <tr>
                    <td>2. Kat Koridoru</td>
                    <td>—</td>
                    <td>Aktif</td>
                </tr>
            </tbody>
        </table>
    </main>
</div>

</body>
</html>
