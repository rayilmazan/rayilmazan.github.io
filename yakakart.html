<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okul Yaka Kartı Oluşturucu - Baskıya Hazır A4 (Yatay)</title>
  <!-- jsPDF Kütüphanesi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel-bg);
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    header .sub-info { font-size: 0.85rem; color: var(--text-muted); }

    .app-container {
      display: flex;
      flex: 1;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 900px) {
      .app-container { flex-direction: column; }
    }

    /* Sol Panel - Form */
    .controls-panel {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    /* Şablon Seçimi Grid */
    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
    }

    .template-btn {
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .template-btn:hover { border-color: #38bdf8; }

    .template-btn.active {
      border-color: #38bdf8;
      background: #1e3a8a;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    
    .form-input {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .form-input:focus { border-color: #38bdf8; }

    .file-input-wrapper {
      position: relative;
      background: #0f172a;
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .file-input-wrapper:hover { border-color: #38bdf8; }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .photo-controls-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .photo-controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .photo-controls-row label { font-size: 0.78rem; color: var(--text-muted); width: 70px; }
    .photo-controls-row input[type="range"] { flex: 1; }

    .btn-auto-face {
      background: #0d9488;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-auto-face:hover { background: #0f766e; }

    .btn-submit {
      background: #0284c7;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #0369a1; }

    /* Sağ Panel - Önizleme */
    .preview-panel {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-preview-container {
      width: 330px;
      height: 465px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    #cardCanvas {
      width: 100%;
      height: 100%;
    }

    .badge-info-tag {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1>📇 Okul Yaka Kartı Jeneratörü</h1>
    <span class="sub-info">A4 Yatay Baskı Düzeni • 8 Adet / Sayfa • Otomatik Yüz Tespiti</span>
  </header>

  <div class="app-container">
    
    <!-- SOL KONTROL PANELİ -->
    <div class="controls-panel">
      <div class="section-title">1. Şablon Seçimi</div>
      <div class="template-grid">
        <button class="template-btn active" data-template="nobetci_ogrenci">Nöbetçi Öğrenci</button>
        <button class="template-btn" data-template="nobetci_ogretmen">Nöbetçi Öğretmen</button>
        <button class="template-btn" data-template="ogretmen">Öğretmen</button>
        <button class="template-btn" data-template="ziyaretci">Ziyaretçi</button>
      </div>

      <div class="section-title">2. Kart Bilgileri</div>

      <div class="form-group">
        <label for="inputSchool">Okul Adı (Uzun isimler otomatik alt satıra geçer)</label>
        <input type="text" id="inputSchool" class="form-input" value="ŞEHİT ÖMER HALİSDEMİR ANADOLU İMAM HATİP LİSESİ" placeholder="Örn: ATATÜRK ORTAOKULU">
      </div>

      <div class="form-group" id="groupName">
        <label for="inputName">Adı Soyadı</label>
        <input type="text" id="inputName" class="form-input" value="MUSTAFA KEMAL ATATÜRK" placeholder="Örn: AHMET YILMAZ">
      </div>

      <div class="form-group" id="groupSub">
        <label for="inputSub">Alt Bilgi (Branş / Görev / Unvan)</label>
        <input type="text" id="inputSub" class="form-input" value="BİLİŞİM TEKNOLOJİLERİ VE YAZILIM ÖĞRETMENİ" placeholder="Örn: Matematik Öğretmeni">
      </div>

      <div class="form-group" id="groupPhoto">
        <label>Fotoğraf Yükle & Yüz Odakla</label>
        <div class="file-input-wrapper">
          <span id="fileName">📷 Fotoğraf Seç</span>
          <input type="file" id="inputPhoto" accept="image/*">
        </div>

        <div class="photo-controls-box">
          <button type="button" class="btn-auto-face" id="btnAutoFace">
            🔍 Otomatik Yüz Tespit Et & Büyüt
          </button>
          
          <div class="photo-controls-row">
            <label>Büyütme:</label>
            <input type="range" id="photoScale" min="0.5" max="4" step="0.05" value="1">
          </div>

          <div class="photo-controls-row">
            <label>Yatay (X):</label>
            <input type="range" id="photoOffsetX" min="-200" max="200" step="2" value="0">
          </div>

          <div class="photo-controls-row">
            <label>Dikey (Y):</label>
            <input type="range" id="photoOffsetY" min="-200" max="200" step="2" value="0">
          </div>
        </div>
      </div>

      <button class="btn-submit" id="btnDownloadPDF">
        📄 A4 Yatay PDF İndir (8 Kart / Sayfa)
      </button>
    </div>

    <!-- SAĞ ÖNİZLEME PANELİ -->
    <div class="preview-panel">
      <div class="section-title" style="margin-bottom: 15px;">Canlı Kart Önizlemesi</div>
      <div class="card-preview-container">
        <canvas id="cardCanvas" width="600" height="850"></canvas>
      </div>
      <div class="badge-info-tag">✂️ A4 Yatay Sayfada 8 Adet Tam Sığacak Şekilde Düzenlenir</div>
    </div>

  </div>

  <script>
    const TEMPLATES = {
      nobetci_ogrenci: {
        title: "NÖBETÇİ ÖĞRENCİ",
        color: "#2563EB",
        hasPhoto: false,
        hasName: false,
        giantLetter: "N",
        letterPos: "center"
      },
      nobetci_ogretmen: {
        title: "NÖBETÇİ ÖĞRETMEN",
        color: "#EF4444",
        hasPhoto: true,
        hasName: true,
        giantLetter: "N",
        letterPos: "bottom-left"
      },
      ogretmen: {
        title: "ÖĞRETMEN",
        color: "#06B6D4",
        hasPhoto: true,
        hasName: true,
        giantLetter: null
      },
      ziyaretci: {
        title: "ZİYARETÇİ",
        color: "#FF4D4D",
        hasPhoto: false,
        hasName: false,
        giantLetter: "Z",
        letterPos: "center"
      }
    };

    let activeTemplate = "nobetci_ogrenci";
    let loadedImage = null;

    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');
    
    const inputSchool = document.getElementById('inputSchool');
    const inputName = document.getElementById('inputName');
    const inputSub = document.getElementById('inputSub');
    const inputPhoto = document.getElementById('inputPhoto');
    const photoScale = document.getElementById('photoScale');
    const photoOffsetX = document.getElementById('photoOffsetX');
    const photoOffsetY = document.getElementById('photoOffsetY');
    const btnAutoFace = document.getElementById('btnAutoFace');

    const groupName = document.getElementById('groupName');
    const groupSub = document.getElementById('groupSub');
    const groupPhoto = document.getElementById('groupPhoto');
    const btnDownloadPDF = document.getElementById('btnDownloadPDF');

    document.querySelectorAll('.template-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTemplate = btn.dataset.template;
        updateFormVisibility();
        renderCard();
      });
    });

    function updateFormVisibility() {
      const config = TEMPLATES[activeTemplate];
      groupPhoto.style.display = config.hasPhoto ? 'flex' : 'none';
      groupName.style.display = config.hasName ? 'flex' : 'none';
      groupSub.style.display = config.hasName ? 'flex' : 'none';
    }

    inputPhoto.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('fileName').textContent = file.name;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            loadedImage = img;
            detectAndCenterFace();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Otomatik Yüz Tespiti (Piksel Cilt Analizi)
    function detectAndCenterFace() {
      if (!loadedImage) return;

      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      const tw = 200;
      const th = Math.round((loadedImage.height / loadedImage.width) * tw);
      tempCanvas.width = tw;
      tempCanvas.height = th;

      tempCtx.drawImage(loadedImage, 0, 0, tw, th);
      const imgData = tempCtx.getImageData(0, 0, tw, th);
      const data = imgData.data;

      let totalX = 0, totalY = 0, skinCount = 0;
      let minX = tw, maxX = 0, minY = th, maxY = 0;

      for (let y = 0; y < th; y++) {
        for (let x = 0; x < tw; x++) {
          const idx = (y * tw + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];

          const isSkin = (r > 95 && g > 40 && b > 20 &&
                          (Math.max(r, g, b) - Math.min(r, g, b) > 15) &&
                          Math.abs(r - g) > 15 && r > g && r > b);

          if (isSkin) {
            totalX += x;
            totalY += y;
            skinCount++;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (skinCount > 50) {
        const faceX = (totalX / skinCount) / tw;
        const faceY = (totalY / skinCount) / th;
        const faceBoxHeight = (maxY - minY) / th;
        
        let targetScale = 1.8 / Math.max(faceBoxHeight, 0.3);
        targetScale = Math.min(Math.max(targetScale, 1.2), 3.5);

        const offsetX = Math.round((0.5 - faceX) * 280);
        const offsetY = Math.round((0.5 - faceY) * 280);

        photoScale.value = targetScale.toFixed(2);
        photoOffsetX.value = offsetX;
        photoOffsetY.value = offsetY;
      } else {
        photoScale.value = 1.5;
        photoOffsetX.value = 0;
        photoOffsetY.value = 20;
      }

      renderCard();
    }

    btnAutoFace.addEventListener('click', detectAndCenterFace);

    [inputSchool, inputName, inputSub, photoScale, photoOffsetX, photoOffsetY].forEach(el => {
      el.addEventListener('input', renderCard);
    });

    // Otomatik Metin Sarmalama ve Ortalama
    function drawWrappedText(ctx, text, x, y, maxWidth, initialFontSize, fontColor, fontWeight = "bold", maxLines = 3) {
      text = text.trim();
      if (!text) return;

      let fontSize = initialFontSize;
      ctx.fillStyle = fontColor;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      let lines = [];
      
      while (fontSize >= 12) {
        ctx.font = `${fontWeight} ${fontSize}px Arial, sans-serif`;
        const words = text.split(/\s+/);
        lines = [];
        let currentLine = words[0];

        for (let i = 1; i < words.length; i++) {
          const testLine = currentLine + " " + words[i];
          const metrics = ctx.measureText(testLine);
          if (metrics.width > maxWidth) {
            lines.push(currentLine);
            currentLine = words[i];
          } else {
            currentLine = testLine;
          }
        }
        lines.push(currentLine);

        if (lines.length <= maxLines) {
          const allFit = lines.every(l => ctx.measureText(l).width <= maxWidth);
          if (allFit) break;
        }

        fontSize -= 2;
      }

      const lineHeight = fontSize * 1.2;
      const totalHeight = lines.length * lineHeight;
      const startY = y - (totalHeight / 2) + (lineHeight / 2);

      lines.forEach((line, index) => {
        ctx.fillText(line, x, startY + (index * lineHeight));
      });

      ctx.textBaseline = "alphabetic";
    }

    // Kart Çizimi
    function renderCard() {
      const config = TEMPLATES[activeTemplate];
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 2;
      ctx.strokeRect(w / 2 - 50, 15, 100, 25);

      drawWrappedText(ctx, inputSchool.value.toUpperCase() || "OKUL ADI", w / 2, 90, w - 60, 32, config.color, "bold", 2);

      if (config.giantLetter && config.letterPos === "center") {
        ctx.fillStyle = config.color;
        ctx.font = "900 380px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(config.giantLetter, w / 2, h / 2 - 20);
        ctx.textBaseline = "alphabetic";
      }

      if (config.hasPhoto) {
        const centerX = w / 2;
        const centerY = 315;
        const radius = 135;

        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = config.color;
        ctx.lineWidth = 12;
        ctx.stroke();
        ctx.clip();

        if (loadedImage) {
          const scale = parseFloat(photoScale.value);
          const offX = parseFloat(photoOffsetX.value);
          const offY = parseFloat(photoOffsetY.value);

          const imgW = loadedImage.width * scale;
          const imgH = loadedImage.height * scale;

          const ix = centerX - (imgW / 2) + offX;
          const iy = centerY - (imgH / 2) + offY;

          ctx.drawImage(loadedImage, ix, iy, imgW, imgH);
        } else {
          ctx.fillStyle = "#f1f5f9";
          ctx.fillRect(centerX - radius, centerY - radius, radius * 2, radius * 2);
          ctx.fillStyle = "#64748b";
          ctx.font = "bold 26px Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("FOTOĞRAF", centerX, centerY + 10);
        }
        ctx.restore();

        drawWrappedText(ctx, inputName.value.toUpperCase() || "ADI SOYADI", w / 2, 515, w - 50, 38, "#000000", "bold", 2);
        drawWrappedText(ctx, inputSub.value.toUpperCase() || "ALT BİLGİ", w / 2, 595, w - 60, 26, config.color, "bold", 2);
      }

      const barHeight = 170;
      const barY = h - barHeight;

      if (config.giantLetter && config.letterPos === "bottom-left") {
        ctx.save();
        const nX = 20;
        const nY = h - 20;

        ctx.font = "900 270px Arial, sans-serif";
        ctx.textAlign = "left";

        ctx.fillStyle = config.color;
        ctx.fillText("N", nX, nY);

        ctx.fillStyle = config.color;
        ctx.fillRect(0, barY, w, barHeight);

        ctx.beginPath();
        ctx.rect(0, barY, w, barHeight);
        ctx.clip();

        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.fillText("N", nX, nY);
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 14;
        ctx.strokeText("N", nX, nY);

        ctx.restore();
      } else {
        ctx.fillStyle = config.color;
        ctx.fillRect(0, barY, w, barHeight);
      }

      ctx.fillStyle = "#FFFFFF";
      ctx.font = "900 58px Arial, sans-serif";
      ctx.textAlign = "center";

      const titleParts = config.title.split(" ");
      const textXShift = (config.letterPos === "bottom-left") ? 45 : 0;

      if (titleParts.length > 1) {
        ctx.fillText(titleParts[0], (w / 2) + textXShift, barY + 65);
        ctx.fillText(titleParts[1], (w / 2) + textXShift, barY + 135);
      } else {
        ctx.fillText(config.title, (w / 2) + textXShift, barY + 105);
      }
    }

    // PDF İndirme (A4 Yatay 4x2 = 8 Kart)
    btnDownloadPDF.addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('l', 'mm', 'a4');
      const cardImgData = canvas.toDataURL('image/jpeg', 0.95);

      const cardW = 63;
      const cardH = 92;
      const cols = 4;
      const rows = 2;
      const gapX = 6;
      const gapY = 7;

      const startX = (297 - (cols * cardW + (cols - 1) * gapX)) / 2;
      const startY = (210 - (rows * cardH + (rows - 1) * gapY)) / 2;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = startX + c * (cardW + gapX);
          const y = startY + r * (cardH + gapY);

          pdf.addImage(cardImgData, 'JPEG', x, y, cardW, cardH);

          pdf.setDrawColor(160, 160, 160);
          pdf.setLineWidth(0.2);
          const markLen = 3;

          pdf.line(x - markLen, y, x, y);
          pdf.line(x, y - markLen, x, y);

          pdf.line(x + cardW, y, x + cardW + markLen, y);
          pdf.line(x + cardW, y - markLen, x + cardW, y);

          pdf.line(x - markLen, y + cardH, x, y + cardH);
          pdf.line(x, y + cardH, x, y + cardH + markLen);

          pdf.line(x + cardW, y + cardH, x + cardW + markLen, y + cardH);
          pdf.line(x + cardW, y + cardH, x + cardW, y + cardH + markLen);
        }
      }

      pdf.save(`${activeTemplate}_yaka_kartlari_A4_Yatay.pdf`);
    });

    updateFormVisibility();
    renderCard();
  </script>
</body>
</html>
