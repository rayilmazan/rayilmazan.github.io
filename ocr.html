<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çoklu Görsel OCR & Otomatik A4 Oluşturucu</title>
    
    <!-- Kütüphaneler -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --success-color: #10B981;
            --success-hover: #059669;
            --bg-color: #F3F4F6;
            --container-bg: #FFFFFF;
            --text-color: #1F2937;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .main-wrapper { width: 100%; max-width: 850px; }
        
        .file-upload-wrapper { position: relative; margin-bottom: 20px; }
        .file-upload-label { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; border: 2px dashed var(--primary-color); border-radius: 8px; background-color: #EEF2FF; cursor: pointer; transition: all 0.3s; text-align: center; }
        .file-upload-label:hover { background-color: #E0E7FF; }
        
        /* Çoklu seçim için input */
        #autoImageInput { opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; }

        .status-container { display: none; margin: 15px 0; padding: 15px; background: #fff; border-radius: 8px; border: 1px solid #ddd; }
        .progress-bar-bg { width: 100%; height: 10px; background-color: #E5E7EB; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .progress-bar-fill { height: 100%; background-color: var(--primary-color); width: 0%; transition: width 0.3s ease; }

        .a4-paper { background-color: white; width: 100%; min-height: 297mm; padding: 20mm; box-shadow: 0 0 10px rgba(0,0,0,0.1); font-family: 'Times New Roman', serif; font-size: 14pt; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; outline: none; }
        
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; margin-top: 10px; }
        .btn-pdf { background-color: #EF4444; }
        .btn-doc { background-color: #2563EB; }
        .btn-copy { background-color: var(--success-color); }
        .btn-clear { background-color: #4B5563; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <h2>📷 Çoklu Görsel OCR & A4 Birleştirici</h2>
        <p>Fotoğrafları seçin, sistem hepsini sırayla okuyup A4 sayfasına eklesin.</p>

        <!-- Çoklu Dosya Seçimi -->
        <div class="file-upload-wrapper">
            <div class="file-upload-label">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="10"/></svg>
                <span>Fotoğrafları Seçin (Çoklu Seçim Desteklenir)</span>
            </div>
            <input type="file" id="autoImageInput" accept="image/*" multiple>
        </div>

        <!-- İlerleme Çubuğu -->
        <div class="status-container" id="statusContainer">
            <div id="statusText" style="font-weight:bold; font-size:14px;">Hazırlanıyor...</div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
        </div>

        <!-- Belge Alanı -->
        <div class="a4-paper" id="a4Paper" contenteditable="true"></div>

        <!-- İşlemler -->
        <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn-pdf" onclick="downloadPDF()">PDF İndir</button>
            <button class="btn-doc" onclick="downloadDOC()">DOCX İndir</button>
            <button class="btn-copy" onclick="copyText()">Tümünü Kopyala</button>
            <button class="btn-clear" onclick="clearAll()">Temizle</button>
        </div>
    </div>

    <script>
        const autoImageInput = document.getElementById('autoImageInput');
        const statusContainer = document.getElementById('statusContainer');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const a4Paper = document.getElementById('a4Paper');

        // Çoklu dosya seçimi tetiklendiğinde
        autoImageInput.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            statusContainer.style.display = 'block';
            
            // Sıralı işleme (Queue)
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusText.textContent = `İşleniyor: ${i + 1} / ${files.length} (${file.name})`;
                progressBar.style.width = `${((i) / files.length) * 100}%`;

                try {
                    const result = await Tesseract.recognize(file, 'tur+eng');
                    const text = result.data.text.trim();
                    
                    if (text) {
                        a4Paper.innerText += (a4Paper.innerText ? "\n\n" : "") + text;
                    }
                } catch (err) {
                    console.error("Hata:", err);
                }
            }

            statusText.textContent = 'Tüm işlemler tamamlandı!';
            progressBar.style.width = '100%';
            setTimeout(() => statusContainer.style.display = 'none', 2000);
            
            // Seçimi sıfırla (aynı dosyayı tekrar eklemek istersen diye)
            autoImageInput.value = '';
        });

        // Yardımcı Fonksiyonlar
        function downloadPDF() {
            html2pdf().from(a4Paper).save('Belge.pdf');
        }

        function downloadDOC() {
            const content = a4Paper.innerHTML.replace(/\n/g, '<br>');
            const blob = new Blob(['<html><head><meta charset="utf-8"></head><body>' + content + '</body></html>'], {type: 'application/msword'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Belge.doc";
            a.click();
        }

        function copyText() {
            navigator.clipboard.writeText(a4Paper.innerText);
            alert("Metin panoya kopyalandı!");
        }

        function clearAll() {
            if(confirm("Tüm sayfalar silinsin mi?")) a4Paper.innerText = '';
        }
    </script>
</body>
</html>
