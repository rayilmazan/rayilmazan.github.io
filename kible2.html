<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kıble Pusulası</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; }
        #map { height: 100vh; width: 100vw; transition: transform 0.1s ease-out; }
        #overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: white; padding: 15px; border-radius: 10px; z-index: 999;
            font-family: sans-serif; pointer-events: none; text-align: center; border: 1px solid #333;
        }
        /* Ekranın ortasında sabit duracak, kıbleyi (cihazın üst yönünü) gösterecek belirgin yeşil ok */
        #direction-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-bottom: 60px solid #2ecc71; /* Belirgin yeşil renk */
            z-index: 1000;
            pointer-events: none;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.6));
        }
    </style>
</head>
<body>

    <div id="overlay">Telefonu düz tutun, üst yönü kıbleyi gösterecektir</div>
    <div id="direction-arrow"></div>
    <div id="map"></div>

    <script>
        // Haritayı başlat
        const map = L.map('map', { zoomControl: false }).setView([0, 0], 18);

        // Uydu görüntüsü katmanı
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Uydu Görüntüsü'
        }).addTo(map);

        let userMarker;
        let userPos = null;
        const kaabaPos = [21.4225, 39.8262]; // Kabe Koordinatları

        // İki nokta arasındaki açı hesaplama (Kıble Açısı)
        function calculateQiblaAngle(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            let θ = Math.atan2(y, x);
            return (θ * 180 / Math.PI + 360) % 360;
        }

        // Konumu al
        navigator.geolocation.watchPosition((pos) => {
            userPos = [pos.coords.latitude, pos.coords.longitude];
            if (!userMarker) {
                userMarker = L.marker(userPos).addTo(map);
            }
            userMarker.setLatLng(userPos);
            map.setView(userPos, 19);
        }, (err) => {
            console.error(err);
        }, { enableHighAccuracy: true });

        // Cihaz yönünü dinle (Cihazın üstü ile kıbleyi eşleştirme)
        window.addEventListener('deviceorientation', (event) => {
            if (!userPos) return;

            let heading = event.webkitCompassHeading; // iOS için
            if (heading === undefined && event.alpha !== null) {
                heading = 360 - event.alpha; // Android için
            }

            if (heading !== undefined && !isNaN(heading)) {
                // Bulunduğumuz konumdan Kabe'ye olan gerçek açı
                const qiblaAngle = calculateQiblaAngle(userPos[0], userPos[1], kaabaPos[0], kaabaPos[1]);
                
                // Cihazın yönü ile Kabe açısını eşitleyecek harita dönüşü
                let rotation = heading - qiblaAngle;

                // Haritayı ters yönde döndürerek okun (cihazın üstünün) doğrudan kıbleye bakmasını sağla
                document.getElementById('map').style.transform = `rotate(${-rotation}deg)`;
            }
        }, true);
    </script>
</body>
</html>
