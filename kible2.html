<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kıble Pusulası</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; }
        
        #overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: white; padding: 12px 20px; border-radius: 10px; z-index: 1000;
            font-family: sans-serif; pointer-events: none; text-align: center; border: 1px solid #444; font-size: 14px;
        }

        /* Seccade / Yön Çerçevesi ve Kabe'yi gösteren net ibre */
        #compass-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280px;
            height: 280px;
            margin-top: -140px;
            margin-left: -140px;
            z-index: 999;
            pointer-events: none;
            border-radius: 50%;
            border: 3px dashed rgba(46, 204, 113, 0.6);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); /* Çevreyi karartarak odak sağlar */
        }

        /* Doğrudan Kıbleyi (Yukarıyı/Seccade yönünü) gösteren belirgin yeşil ok */
        #qibla-pointer {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 45px solid #2ecc71;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.7));
        }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: #e74c3c;
            border: 2px solid white;
            border-radius: 50%;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <div id="overlay">Telefonu düz tutun: Yeşil ok ve seccade yönü Kabe'yi gösterir</div>
    
    <div id="compass-container">
        <div id="qibla-pointer"></div>
    </div>
    <div class="center-dot"></div>

    <div id="map"></div>

    <script>
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0, 0], 18);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

        let userMarker;
        let userPos = null;
        const kaabaPos = [21.4225, 39.8262]; // Kabe koordinatları

        // İki nokta arasındaki tam açı hesabı (Great-circle bearing)
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            let θ = Math.atan2(y, x);
            return (θ * 180 / Math.PI + 360) % 360;
        }

        // Konumu al
        navigator.geolocation.watchPosition((pos) => {
            userPos = [pos.coords.latitude, pos.coords.longitude];
            if (!userMarker) {
                userMarker = L.marker(userPos).addTo(map);
            }
            userMarker.setLatLng(userPos);
            map.setView(userPos, 19);
        }, (err) => {
            console.error(err);
        }, { enableHighAccuracy: true });

        // Cihaz yönelimi (Pusula) işleyicisi
        function handleOrientation(event) {
            if (!userPos) return;

            let heading = null;

            // iOS ve Android uyumlu pusula açısı alma
            if (event.webkitCompassHeading !== undefined) {
                heading = event.webkitCompassHeading; // Safari / iOS
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha; // Android / Chrome
            }

            if (heading !== null && !isNaN(heading)) {
                // Bulunulan konumdan Kabe'ye olan coğrafi açı
                const qiblaBearing = calculateBearing(userPos[0], userPos[1], kaabaPos[0], kaabaPos[1]);

                // Haritanın dönme açısı: Cihazın baktığı yön (heading) ile Kabe açısını hizala
                const mapRotation = heading - qiblaBearing;

                // Haritayı döndürerek ekranın üst kısmının ve yeşil okun tam Kabe'yi göstermesini sağla
                map.getContainer().style.transform = `rotate(${-mapRotation}deg)`;
                map.getContainer().style.transformOrigin = 'center center';
            }
        }

        // Absolute orientation API desteği (modern Android cihazlar için daha kararlı)
        if (window.AbsoluteOrientationSensor) {
            try {
                const sensor = new AbsoluteOrientationSensor({ frequency: 60 });
                sensor.addEventListener('reading', () => {
                    let q = sensor.quaternion;
                    let yaw = Math.atan2(2.0 * (q[0] * q[1] + q[3] * q[2]), q[3] * q[3] + q[0] * q[0] - q[1] * q[1] - q[2] * q[2]);
                    let heading = yaw * (180 / Math.PI);
                    heading = (heading + 360) % 360;
                    
                    if (userPos) {
                        const qiblaBearing = calculateBearing(userPos[0], userPos[1], kaabaPos[0], kaabaPos[1]);
                        let mapRotation = heading - qiblaBearing;
                        map.getContainer().style.transform = `rotate(${-mapRotation}deg)`;
                    }
                });
                sensor.start();
            } catch (e) {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        } else {
            window.addEventListener('deviceorientation', handleOrientation, true);
        }
    </script>
</body>
</html>
