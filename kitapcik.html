<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İki Sütunlu Sayfa Aracı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f2f5;
            color: #333;
        }
        
        /* Ekranda metin girilen ve butonların olduğu üst kısım */
        .kontrol-paneli {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            margin-bottom: 15px;
            font-family: inherit;
        }

        .buton-grubu {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 15px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-pdf { background-color: #d32f2f; }
        .btn-pdf:hover { background-color: #b71c1c; }
        
        .btn-word { background-color: #1976d2; }
        .btn-word:hover { background-color: #1565c0; }

        /* Metnin iki sütun gösterildiği kağıt alanı */
        .kagit-alani {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 210mm; /* A4 Genişliği */
            height: 297mm; /* Sütunun dolduğunu anlaması için sabit A4 yüksekliği */
            margin: 0 auto;
            overflow: hidden; /* A4'ten taşan kısmı gizle veya alt sayfaya atılmasını sağla */
            
            /* İki sütun ayarları */
            column-count: 2;
            column-gap: 30px;
            column-rule: 1px solid #ccc; 
            column-fill: auto; /* ÖNCE 1. SÜTUNU DOLDUR, SONRA 2. SÜTUNA GEÇ */
            text-align: justify;
            white-space: pre-wrap; 
            font-size: 12pt;
            line-height: 1.5;
        }

        /* Sadece PDF/Yazdırma esnasında geçerli olacak kurallar */
        @media print {
            body {
                background: none;
                margin: 0;
            }
            .kontrol-paneli {
                display: none; 
            }
            .kagit-alani {
                box-shadow: none;
                max-width: 100%;
                height: 297mm; 
                padding: 0;
                column-rule: 1px solid #000;
                overflow: visible;
            }
            @page {
                size: A4;
                margin: 15mm;
            }
        }
    </style>
</head>
<body>

    <div class="kontrol-paneli">
        <h2>İki Sütunlu Metin Aracı</h2>
        <p>Metninizi aşağıdaki kutuya yapıştırın. Metin önce sol sütunu tamamen dolduracak, ardından sağ sütuna geçecektir.</p>
        
        <textarea id="metinGirdisi" placeholder="Metninizi buraya yazın veya yapıştırın..."></textarea>
        
        <div class="buton-grubu">
            <button class="btn-pdf" onclick="window.print()">PDF Olarak Al (Yazdır)</button>
            <button class="btn-word" onclick="wordOlarakIndir()">Word Olarak İndir (.doc)</button>
        </div>
    </div>

    <div class="kagit-alani" id="metinCiktisi"></div>

    <script>
        const girdi = document.getElementById('metinGirdisi');
        const cikti = document.getElementById('metinCiktisi');

        girdi.addEventListener('input', function() {
            cikti.textContent = girdi.value;
        });

        function wordOlarakIndir() {
            let htmlIcerik = cikti.innerHTML.replace(/\n/g, '<br>');
            
            let header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Belge</title><style> body { font-family: Arial, sans-serif; } .ikili-sutun { column-count: 2; column-gap: 30px; } </style></head><body>";
            let footer = "</body></html>";
            
            let tamHTML = header + "<div class='ikili-sutun'>" + htmlIcerik + "</div>" + footer;
            
            let blob = new Blob(['\ufeff', tamHTML], { type: 'application/msword' });
            let url = URL.createObjectURL(blob);
            let link = document.createElement('a');
            
            link.href = url;
            link.download = 'iki-sutunlu-belge.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
