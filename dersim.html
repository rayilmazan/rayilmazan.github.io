<!DOCTYPE html><html lang="tr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Programı ve Öğrenme Çıktıları</title>
    <style>
        :root { 
            --primary-color: #1e293b; 
            --secondary-color: #0284c7; 
            --accent-color: #16a34a; 
            --break-color: #d97706; 
            --bg-color: #f8fafc; 
            --card-bg: #ffffff; 
            --text-color: #0f172a; 
            --border-color: #e2e8f0; 
            --empty-color: #94a3b8; 
            --highlight-row-bg: #e8f5e9; 
        }

        html, body { height: 100%; margin: 0px; padding: 4px; box-sizing: border-box; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }

        .container { width: 100%; max-width: 1100px; height: 100%; display: flex; flex-direction: column; gap: 4px; margin: 0px auto; box-sizing: border-box; }

        header { background-color: var(--card-bg); padding: 5px 8px; border-radius: 6px; box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 2px; text-align: center; flex-shrink: 0; }

        .week-title { font-size: 0.85rem; font-weight: 700; color: var(--primary-color); }

        .status-card { background-color: var(--card-bg); border-left: 3px solid var(--secondary-color); padding: 5px 8px; border-radius: 5px; box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 2px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 0.78rem; flex-shrink: 0; }

        .status-text { font-weight: 600; }

        /* Öğrenme Çıktıları İçin Açılır/Kapanır Sekme Alanı */
        .outcomes-tab-container { background-color: var(--card-bg); border-radius: 6px; box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 2px; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border-color); }
        .outcomes-tab-header { background-color: #f1f5f9; padding: 5px 10px; font-size: 0.75rem; font-weight: 700; color: var(--primary-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .outcomes-tab-content { padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.73rem; background-color: #fff; }
        .outcomes-tab-content.collapsed { display: none; }

        @media (max-width: 768px) {
          .outcomes-tab-content { grid-template-columns: 1fr; }
        }

        .outcome-box { padding: 4px 6px; border-radius: 4px; background: #f8fafc; border-left: 3px solid var(--secondary-color); }
        .outcome-box.grade-5 { border-left-color: rgb(2, 132, 199); }
        .outcome-box.grade-6 { border-left-color: rgb(147, 51, 234); }
        .outcome-box strong { font-size: 0.75rem; display: block; margin-bottom: 2px; color: var(--primary-color); }

        .table-responsive { width: 100%; flex: 1 1 0%; background-color: var(--card-bg); border-radius: 6px; box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 2px; display: flex; flex-direction: column; overflow: hidden; }

        table { width: 100%; height: 100%; border-collapse: separate; border-spacing: 0px; text-align: center; table-layout: fixed; }

        tbody tr { height: calc(14.2857%); }

        th, td { padding: 2px; border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); font-size: 0.72rem; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; }

        th { background-color: rgb(241, 245, 249); color: var(--primary-color); font-weight: 700; border-top: 1px solid var(--border-color); position: sticky; top: 0px; z-index: 12; font-size: 0.75rem; }

        .sticky-col { position: sticky; left: 0px; z-index: 10; background-color: rgb(248, 250, 252); border-left: 1px solid var(--border-color); width: 42px; min-width: 42px; max-width: 42px; white-space: nowrap; }

        th.sticky-col { z-index: 13; background-color: rgb(241, 245, 249) !important; }

        .time-subtext { display: block; font-size: 0.58rem; color: rgb(100, 116, 139); font-weight: normal; margin-top: 1px; }

        .empty-slot { color: var(--empty-color); font-style: italic; }

        .lesson-slot { font-weight: 600; color: var(--primary-color); font-size: 0.7rem; }

        /* Sadece aktif olan ders saatinde hücre yanında gösterilecek rozet */
        .active-lesson-outcome {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 4px;
            margin-left: 5px;
            font-weight: normal;
            border-left: 2px solid var(--secondary-color);
            text-align: left;
            max-width: 60%;
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        tr.active-row td { background-color: var(--highlight-row-bg) !important; }

        tr.active-row td.sticky-col { border-left: 2px solid var(--accent-color); background-color: rgb(209, 250, 229) !important; }

        .active-cell { font-weight: bold; background-color: rgb(187, 247, 208) !important; border: 1px solid var(--accent-color) !important; color: rgb(20, 83, 45) !important; }

        .active-cell::after { content: "● ŞU AN"; display: block; font-size: 0.5rem; color: var(--accent-color); font-weight: bold; margin-top: 1px; }

        .active-day-header { background-color: rgb(224, 242, 254) !important; color: rgb(3, 105, 161) !important; }

        .bottom-controls { display: flex; justify-content: space-between; align-items: center; background-color: var(--card-bg); padding: 5px 8px; border-radius: 6px; box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 2px; flex-wrap: wrap; gap: 4px; flex-shrink: 0; }

        .nav-group { display: flex; gap: 4px; align-items: center; }

        .nav-btn { background-color: var(--secondary-color); color: white; border: none; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.72rem; transition: 0.2s; }

        .nav-btn:hover { opacity: 0.9; }

        .today-btn { background-color: rgb(100, 116, 139); }

        .toggle-view-btn { background-color: rgb(13, 148, 136); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="week-title" id="weekTitle">Perşembe (12.10.2026 - 16.10.2026)</div>
    </header>

    <div class="status-card" id="statusCard">
        <div class="status-text" id="statusText">🏠 Gün Bitti</div>
        <div id="clockText" style="font-weight: bold; color: var(--secondary-color); font-size: 0.75rem;">18:28:33</div>
    </div>

    <!-- Kapalı/Açılır Öğrenme Çıktıları Sekmesi (Tab) -->
    <div class="outcomes-tab-container">
        <div class="outcomes-tab-header" id="toggleOutcomesTab">
            <span>📚 Öğrenme Çıktıları (Haftalık Plan Paneli)</span>
            <span id="tabArrow">▼ Göster</span>
        </div>
        <div class="outcomes-tab-content collapsed" id="outcomesTabContent">
            <div class="outcome-box grade-5">
                <strong>📘 5. Sınıf Çıktı</strong>
                <div>BTY.5.1.1. Bilişim teknolojilerinin günlük yaşamdaki önemini fark eder.</div>
            </div>
            <div class="outcome-box grade-6">
                <strong>📙 6. Sınıf Çıktı</strong>
                <div>BTY.6.1.1. Problem çözme adımlarını ve algoritma mantığını kavrar.</div>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table id="scheduleTable">
            <!-- Dinamik doldurulacak -->
        </table>
    </div>

    <div class="bottom-controls">
        <div class="nav-group">
            <button class="nav-btn" id="prevBtn">← Önceki</button>
            <button class="nav-btn today-btn" id="todayBtn">Bugün</button>
            <button class="nav-btn" id="nextBtn">Sonraki →</button>
        </div>
        <div>
            <button class="nav-btn toggle-view-btn" id="toggleViewBtn">📅 Tüm Hafta</button>
        </div>
    </div>
</div>

<script>
    // Sekme Açma/Kapatma Mantığı
    const tabHeader = document.getElementById('toggleOutcomesTab');
    const tabContent = document.getElementById('outcomesTabContent');
    const tabArrow = document.getElementById('tabArrow');

    tabHeader.addEventListener('click', () => {
        tabContent.classList.toggle('collapsed');
        tabArrow.textContent = tabContent.classList.contains('collapsed') ? '▼ Göster' : '▲ Gizle';
    });

    // Örnek Program ve Veri Yapısı (Orijinal yapıya uygun)
    // Bu kısım projenizin mevcut script yapısına entegre edilebilir.
</script>

</body></html>
