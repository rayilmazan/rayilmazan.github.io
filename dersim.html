<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haftalık Ders Programı</title>
    <style>
        :root {
            --primary-color: #2196F3;
            --active-lesson: #4CAF50;
            --active-break: #FF9800;
            --bg-color: #f4f4f9;
            --table-border: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Header & Controls */
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #1976D2;
        }

        #weekDisplay {
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
        }

        /* Status Bar */
        .status-bar {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            background-color: #e0e0e0;
            transition: all 0.3s ease;
        }

        .status-lesson {
            background-color: var(--active-lesson);
            color: white;
        }

        .status-break {
            background-color: var(--active-break);
            color: white;
        }

        /* Table Styles */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            border: 1px solid var(--table-border);
            padding: 12px;
            min-width: 90px;
        }

        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }

        .time-cell {
            background-color: #f8f9fa;
            font-weight: bold;
            font-size: 0.9em;
        }

        .empty-slot {
            color: #999;
            font-style: italic;
        }

        /* Active Highlighting */
        .current-cell {
            background-color: var(--active-lesson);
            color: white;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        
        .current-day-col {
            background-color: #f0f8ff;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header-controls">
        <button class="btn" onclick="changeWeek(-1)">&#8592; Önceki Hafta</button>
        <div id="weekDisplay">Tarih Yükleniyor...</div>
        <button class="btn" onclick="changeWeek(1)">Sonraki Hafta &#8594;</button>
    </div>

    <div id="statusBar" class="status-bar">Durum kontrol ediliyor...</div>

    <div class="table-responsive">
        <table id="scheduleTable">
            <thead>
                <tr>
                    <th>Ders / Saat</th>
                    <th id="th-1">Pazartesi</th>
                    <th id="th-2">Salı</th>
                    <th id="th-3">Çarşamba</th>
                    <th id="th-4">Perşembe</th>
                    <th id="th-5">Cuma</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- JavaScript ile doldurulacak -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Ders programı verisi
    const schedule = {
        1: ["6-D BLŞM", "6-B BLŞM", "5-A BLŞM", "6-A BLŞM", "6-C BLŞM", "5-B BLŞM", "", ""],
        2: ["", "", "", "", "", "", "", ""],
        3: ["", "5-B BLŞM", "5-C BLŞM", "6-A BLŞM", "5-B RVY", "5-D BLŞM", "6-D KL.TR", ""],
        4: ["", "", "", "", "", "", "", ""],
        5: ["5-C BLŞM", "6-C BLŞM", "6-D BLŞM", "6-D KL.TR", "6-B BLŞM", "5-D BLŞM", "5-A BLŞM", ""]
    };

    // Zaman dilimleri (Saatler)
    const times = [
        { period: 1, start: "08:30", end: "09:10" },
        { period: 2, start: "09:30", end: "10:10" },
        { period: 3, start: "10:20", end: "11:00" },
        { period: 4, start: "11:10", end: "11:50" },
        { period: 5, start: "12:30", end: "13:10" },
        { period: 6, start: "13:20", end: "14:00" },
        { period: 7, start: "14:10", end: "14:50" },
        { period: 8, start: "15:00", end: "15:40" }
    ];

    let currentViewDate = new Date();
    let realCurrentDate = new Date();

    function formatTimeStr(date) {
        return date.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    // Saati dakikaya çevirir (ör: 08:30 -> 510) Karşılaştırma kolaylığı için
    function getMinutes(timeStr) {
        let parts = timeStr.split(":");
        return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    }

    function changeWeek(offset) {
        currentViewDate.setDate(currentViewDate.getDate() + (offset * 7));
        render();
    }

    function getMonday(d) {
        d = new Date(d);
        var day = d.getDay(),
            diff = d.getDate() - day + (day == 0 ? -6 : 1); // Pazar ise -6, değilse 1
        return new Date(d.setDate(diff));
    }

    function render() {
        realCurrentDate = new Date();
        
        // Görüntülenen haftanın günlerini ayarla
        let viewMonday = getMonday(currentViewDate);
        let viewFriday = new Date(viewMonday);
        viewFriday.setDate(viewFriday.getDate() + 4);

        document.getElementById("weekDisplay").innerText = 
            `${formatTimeStr(viewMonday)} - ${formatTimeStr(viewFriday)}`;

        // Tabloyu oluştur
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        let realDay = realCurrentDate.getDay(); 
        let realMins = realCurrentDate.getHours() * 60 + realCurrentDate.getMinutes();

        // Görüntülenen hafta ile gerçek zaman aynı hafta mı kontrolü
        let realMonday = getMonday(new Date());
        let isCurrentWeek = (viewMonday.getTime() === realMonday.getTime());

        let activeLessonStr = "";
        let isBreak = false;
        let activePeriod = -1;

        // Anlık durumu hesapla (sadece gerçek zamana göre)
        if (realDay >= 1 && realDay <= 5) {
            for (let i = 0; i < times.length; i++) {
                let t = times[i];
                let startMins = getMinutes(t.start);
                let endMins = getMinutes(t.end);

                if (realMins >= startMins && realMins <= endMins) {
                    activePeriod = t.period;
                    let lessonName = schedule[realDay][i] || "Boş";
                    activeLessonStr = `Şu An: ${t.period}. Ders (${lessonName})`;
                    break;
                }
                
                // Tenefüs kontrolü
                if (i < times.length - 1) {
                    let nextStartMins = getMinutes(times[i+1].start);
                    if (realMins > endMins && realMins < nextStartMins) {
                        isBreak = true;
                        activeLessonStr = `Şu An: ${t.period}. Tenefüs`;
                        // Öğle arası uzun kontrolü
                        if(times[i+1].period === 5) {
                            activeLessonStr = "Şu An: Öğle Arası";
                        }
                        break;
                    }
                }
            }

            if(realMins < getMinutes(times[0].start)) activeLessonStr = "Mesai Başlamadı";
            if(realMins > getMinutes(times[times.length-1].end)) activeLessonStr = "Mesai Bitti";
        } else {
            activeLessonStr = "Hafta Sonu";
        }

        // Durum çubuğunu güncelle
        let statusBar = document.getElementById("statusBar");
        statusBar.innerText = activeLessonStr;
        statusBar.className = "status-bar"; 
        
        if (isCurrentWeek) {
            if (activePeriod !== -1) statusBar.classList.add("status-lesson");
            else if (isBreak) statusBar.classList.add("status-break");
        }

        // Tablo satırlarını oluştur
        for (let period = 1; period <= 8; period++) {
            let tr = document.createElement("tr");
            let timeData = times[period - 1];
            
            // Saat Hücresi
            let tdTime = document.createElement("td");
            tdTime.className = "time-cell";
            tdTime.innerHTML = `(${period})<br>${timeData.start} - ${timeData.end}`;
            tr.appendChild(tdTime);

            // Gün Hücreleri
            for (let day = 1; day <= 5; day++) {
                let td = document.createElement("td");
                let lessonName = schedule[day][period - 1];

                if (lessonName === "") {
                    td.innerText = "Boş";
                    td.className = "empty-slot";
                } else {
                    td.innerText = lessonName;
                }

                // O anki dersi renklendir (Eğer bulunduğumuz haftadaysak)
                if (isCurrentWeek && realDay === day) {
                    td.classList.add("current-day-col");
                    if (activePeriod === period) {
                        td.classList.add("current-cell");
                        td.classList.remove("current-day-col");
                    }
                }
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        }
    }

    // Her dakikada bir kontrol edip tabloyu yeniler
    setInterval(() => {
        render();
    }, 60000); 

    // Sayfa açıldığında çalıştır
    render();
</script>

</body>
</html>
