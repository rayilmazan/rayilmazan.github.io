<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayılmazan - Dijital Müfredat ve Takvim Asistanı</title>
    <style>
        :root {
            --bg-color: #121417;
            --panel-bg: #1a1d23;
            --panel-border: #2e3542;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            padding: 20px;
        }

        header {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
        }

        .logo-area h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .logo-area p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .stats-box {
            display: flex;
            gap: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            border: 1px solid var(--panel-border);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .theme-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            margin-bottom: 20px;
            padding: 20px;
        }

        .theme-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .theme-title {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: bold;
        }

        .theme-meta {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .outcome-list {
            list-style: none;
        }

        .outcome-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }

        .outcome-item:last-child {
            border-bottom: none;
        }

        .outcome-item input[type="checkbox"] {
            margin-top: 4px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .outcome-text {
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .outcome-code {
            font-family: var(--font-mono);
            color: var(--warning);
            font-size: 0.85rem;
            margin-right: 5px;
        }

        .actions-bar {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 16px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .btn:hover {
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>RAYILMAZAN // DİJİTAL MÜFREDAT ASİSTANI</h1>
            <p>Bilişim Teknolojileri ve Yazılım (5. ve 6. Sınıf) Kılavuz Entegrasyonu</p>
        </div>
        <div class="stats-box">
            <div>TAMAMLANAN: <span id="completedCount">0</span> / <span id="totalCount">0</span></div>
            <div>ORAN: <span id="percentComplete">0%</span></div>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(5)">5. Sınıf Müfredatı</button>
        <button class="tab-btn tab-6-btn" onclick="switchTab(6)">6. Sınıf Müfredatı</button>
    </div>

    <!-- 5. SINIF İÇERİĞİ -->
    <div id="tab-5" class="tab-content active">
        <div id="container-5"></div>
    </div>

    <!-- 6. SINIF İÇERİĞİ -->
    <div id="tab-6" class="tab-content">
        <div id="container-6"></div>
    </div>

    <div class="actions-bar">
        <button class="btn" onclick="resetProgress()">İlerlemeni Sıfırla</button>
        <button class="btn" onclick="exportData()">JSON Yedek Al</button>
    </div>

    <script>
        const curriculumData = {
            5: [
                {
                    title: "1. Tema: Bilişim Teknolojilerinin Hayatımızdaki Yeri",
                    hours: "14 Ders Saati",
                    outcomes: [
                        { code: "BTY.5.1.1", text: "Günlük yaşamda kullanılan bilişim teknolojilerini sınıflandırabilme." },
                        { code: "BTY.5.1.2", text: "Bilişim teknolojilerinin birey ve toplum üzerindeki etkilerini özetleyebilme." },
                        { code: "BTY.5.1.3", text: "Dijital vatandaşlık uygulamalarını sınıflandırabilme." },
                        { code: "BTY.5.1.4", text: "Yapay zekâ ile ilgili temel kavramları ve özellikleri sorgulayabilme." },
                        { code: "BTY.5.1.5", text: "Bilgisayar sistemlerini çözümleyebilme." },
                        { code: "BTY.5.1.6", text: "Dosya ve klasör yönetimi ile ilgili temel işlemlerle çalışabilme." }
                    ]
                },
                {
                    title: "2. Tema: Dijital Ürün Tasarımı ve Geliştirme",
                    hours: "16 Ders Saati",
                    outcomes: [
                        { code: "BTY.5.2.1", text: "Görsel düzenleme programlarından yararlanabilme." },
                        { code: "BTY.5.2.2", text: "Görsel için kurgu oluşturabilme." },
                        { code: "BTY.5.2.3", text: "Görsel ürün geliştirebilme." },
                        { code: "BTY.5.2.4", text: "Kelime işlemci programlarından yararlanabilme." },
                        { code: "BTY.5.2.5", text: "Kelime işlemci dosyası geliştirebilme." },
                        { code: "BTY.5.2.6", text: "Sunum programlarından yararlanabilme." },
                        { code: "BTY.5.2.7", text: "Sunum dosyası oluşturabilme." }
                    ]
                },
                {
                    title: "3. Tema: Bilgisayar Ağları ve İletişim",
                    hours: "6 Ders Saati",
                    outcomes: [
                        { code: "BTY.5.3.1", text: "Bilgisayar ağlarını ve ağ bileşenlerini sınıflandırabilme." },
                        { code: "BTY.5.3.2", text: "Bilgisayar ağ türlerini ve bağlanma yöntemlerini karşılaştırabilme." },
                        { code: "BTY.5.3.3", text: "İnternette bilgi kaynaklarını ve arama yöntemlerini etkili kullanabilme." }
                    ]
                },
                {
                    title: "4. Tema: Bilişim Etiği ve Siber Güvenlik",
                    hours: "6 Ders Saati",
                    outcomes: [
                        { code: "BTY.5.4.1", text: "Bilişim etiği ve ilkelerini günlük yaşamla ilişkilendirebilme." },
                        { code: "BTY.5.4.2", text: "Dijital ortamlarda gizlilik ve güvenliği sağlama yöntemlerini belirleyebilme." }
                    ]
                },
                {
                    title: "5. Tema: Yapay Zekâ",
                    hours: "8 Ders Saati",
                    outcomes: [
                        { code: "BTY.5.5.1", text: "Yapay zekânın kullanım alanlarını ve alt dallarını sınıflandırabilme." },
                        { code: "BTY.5.5.2", text: "Yapay zekâ süreçlerinde güvenliğin önemini sorgulayabilme." }
                    ]
                },
                {
                    title: "6. Tema: Yazılım Tasarımı ve Programlama",
                    hours: "18 Ders Saati",
                    outcomes: [
                        { code: "BTY.5.6.1", text: "Bilgi kaynaklarını ve internette arama yöntemlerini yönetebilme." },
                        { code: "BTY.5.6.2", text: "Algoritma test etme ve geri bildirim alma süreçlerini uygulayabilme." },
                        { code: "BTY.5.6.3", text: "Yazılımda kullanılan bileşenleri sınıflandırabilme." },
                        { code: "BTY.5.6.4", text: "Blok tabanlı ortamda yazılım geliştirme." },
                        { code: "BTY.5.6.5", text: "Blok tabanlı ortamda yazılım değerlendirme." }
                    ]
                }
            ],
            6: [
                {
                    title: "1. Tema: Bilişim Teknolojilerinin Hayatımızdaki Yeri",
                    hours: "4 Ders Saati",
                    outcomes: [
                        { code: "BTY.6.1.1", text: "Yenilikçi bilişim teknolojilerini sınıflandırabilme." },
                        { code: "BTY.6.1.2", text: "Bilişim teknolojilerinin gelecekteki durumlarına yönelik çıkarım yapabilme." }
                    ]
                },
                {
                    title: "2. Tema: Dijital Ürün Tasarımı ve Geliştirme",
                    hours: "16 Ders Saati",
                    outcomes: [
                        { code: "BTY.6.2.1", text: "Tablolama programlarına giriş yapabilme." },
                        { code: "BTY.6.2.2", text: "Ses dosyası için kurgu oluşturabilme." },
                        { code: "BTY.6.2.3", text: "Video dosyası için kurgu oluşturabilme." }
                    ]
                },
                {
                    title: "3. Tema: Bilgisayar Ağları ve İletişim",
                    hours: "8 Ders Saati",
                    outcomes: [
                        { code: "BTY.6.3.1", text: "İletişim teknolojileri ve çeşitlerini inceleyebilme." },
                        { code: "BTY.6.3.2", text: "İnternette ileri düzey arama yapabilme." },
                        { code: "BTY.6.3.3", text: "Etkileşimli web araçlarını etkin kullanabilme." }
                    ]
                },
                {
                    title: "4. Tema: Bilişim Etiği ve Siber Güvenlik",
                    hours: "8 Ders Saati",
                    outcomes: [
                        { code: "BTY.6.4.1", text: "Bilişim etiği ve ilkelerini uygulayabilme." },
                        { code: "BTY.6.4.2", text: "Telif hakları ve lisans türlerini ayırt edebilme." },
                        { code: "BTY.6.4.3", text: "Güvenli siber ortam oluşturma stratejilerini belirleyebilme." }
                    ]
                },
                {
                    title: "5. Tema: Yapay Zekâ",
                    hours: "12 Ders Saati",
                    outcomes: [
                        { code: "BTY.6.5.1", text: "Yapay zekâda verinin rolünü kavrayabilme." },
                        { code: "BTY.6.5.2", text: "Yapay zekâ araçlarını deneyimleyebilme." },
                        { code: "BTY.6.5.3", text: "Yapay zekâ araçları ile model geliştirebilme." }
                    ]
                },
                {
                    title: "6. Tema: Yazılım Tasarımı ve Programlama",
                    hours: "20 Ders Saati",
                    outcomes: [
                        { code: "BTY.6.6.1", text: "Blok tabanlı programlama ortamına giriş yapabilme." },
                        { code: "BTY.6.6.2", text: "Blok tabanlı ortamda tasarım ve programlama yapabilme." },
                        { code: "BTY.6.6.3", text: "Yapay zekâ destekli ürün geliştirme ve sunum yapabilme." }
                    ]
                }
            ]
        };

        function renderCurriculum() {
            ['5', '6'].forEach(grade => {
                const container = document.getElementById(`container-${grade}`);
                container.innerHTML = '';
                curriculumData[grade].forEach((theme, tIndex) => {
                    let html = `
                        <div class="theme-card">
                            <div class="theme-header">
                                <span class="theme-title">${theme.title}</span>
                                <span class="theme-meta">${theme.hours}</span>
                            </div>
                            <ul class="outcome-list">
                    `;
                    theme.outcomes.forEach((outcome, oIndex) => {
                        const storageKey = `rayilmazan_g${grade}_t${tIndex}_o${oIndex}`;
                        const isChecked = localStorage.getItem(storageKey) === 'true' ? 'checked' : '';
                        html += `
                            <li class="outcome-item">
                                <input type="checkbox" id="${storageKey}" ${isChecked} onchange="updateProgress('${storageKey}')">
                                <label for="${storageKey}" class="outcome-text">
                                    <span class="outcome-code">[${outcome.code}]</span> ${outcome.text}
                                </label>
                            </li>
                        `;
                    });
                    html += `</ul></div>`;
                    container.innerHTML += html;
                });
            });
            calculateStats();
        }

        function switchTab(grade) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(grade === 5) {
                document.querySelector('.tab-btn').classList.add('active');
                document.getElementById('tab-5').classList.add('active');
            } else {
                document.querySelector('.tab-6-btn').classList.add('active');
                document.getElementById('tab-6').classList.add('active');
            }
        }

        function updateProgress(key) {
            const checkbox = document.getElementById(key);
            localStorage.setItem(key, checkbox.checked);
            calculateStats();
        }

        function calculateStats() {
            let total = 0;
            let completed = 0;
            ['5', '6'].forEach(grade => {
                curriculumData[grade].forEach((theme, tIndex) => {
                    theme.outcomes.forEach((_, oIndex) => {
                        total++;
                        const storageKey = `rayilmazan_g${grade}_t${tIndex}_o${oIndex}`;
                        if(localStorage.getItem(storageKey) === 'true') {
                            completed++;
                        }
                    });
                });
            });
            document.getElementById('totalCount').innerText = total;
            document.getElementById('completedCount').innerText = completed;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            document.getElementById('percentComplete').innerText = percent + '%';
        }

        function resetProgress() {
            if(confirm("Tüm ilerleme sıfırlansın mı?")) {
                localStorage.clear();
                renderCurriculum();
            }
        }

        function exportData() {
            let data = {};
            for(let i=0; i<localStorage.length; i++) {
                let key = localStorage.key(i);
                if(key.startsWith('rayilmazan_')) {
                    data[key] = localStorage.getItem(key);
                }
            }
            let blob = new Blob([JSON.stringify(data, null, 2)], {type: 'json'});
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'rayilmazan_mufredat_yedek.json';
            a.click();
        }

        window.onload = renderCurriculum;
    </script>
</body>
</html>
