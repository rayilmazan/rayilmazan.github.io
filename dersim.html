<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayılmazan - Dijital Müfredat Asistanı</title>
    <!-- PDF oluşturma işlemi için jsPDF kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #1a1d24;
            --text-primary: #c5cddb;
            --text-secondary: #7e899c;
            --accent: #d25a29; 
            --border-color: #2c313c;
            --panel-border: inset 2px 2px 5px rgba(255,255,255,0.05), inset -2px -2px 5px rgba(0,0,0,0.5);
        }
        
        body {
            margin: 0; padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Courier New', Courier, monospace;
            background-image: linear-gradient(rgba(15, 17, 21, 0.9), rgba(15, 17, 21, 0.9)),
                url('data:image/svg+xml;utf8,<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h40v40H0z" fill="none"/><path d="M0 39h40M39 0v40" stroke="%231a1d24" stroke-width="1"/></svg>');
        }

        header {
            display: flex; align-items: center; justify-content: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px; margin-bottom: 20px;
        }

        header img { height: 60px; margin-right: 20px; filter: grayscale(20%) drop-shadow(0 0 5px var(--accent)); }
        header h1 { margin: 0; color: var(--accent); font-size: 2em; letter-spacing: 2px; text-transform: uppercase; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { 
            flex: 1; padding: 15px; text-align: center; cursor: pointer;
            background: var(--panel-bg); border: 1px solid var(--border-color);
            box-shadow: var(--panel-border); font-weight: bold; color: var(--text-secondary);
            transition: all 0.2s ease;
        }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

        .container { 
            background: var(--panel-bg); border: 1px solid var(--border-color);
            padding: 20px; position: relative; box-shadow: var(--panel-border);
        }
        
        .container::before {
            content: ''; position: absolute; top: 10px; right: 10px; width: 30px; height: 10px;
            background: repeating-linear-gradient(90deg, var(--border-color), var(--border-color) 2px, transparent 2px, transparent 4px);
        }

        .week-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        button { 
            background: var(--bg-color); color: var(--accent); border: 1px solid var(--accent); 
            padding: 10px 20px; cursor: pointer; font-family: inherit; font-weight: bold;
            box-shadow: 2px 2px 0px var(--accent);
        }
        button:active { transform: translate(2px, 2px); box-shadow: none; }
        
        .date-display { font-size: 1.2em; color: var(--accent); text-align: center; }

        .data-box { 
            border: 1px solid var(--border-color); padding: 15px; margin-bottom: 20px;
            background: #111317; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .data-box h3 { color: var(--text-secondary); margin-top: 0; font-size: 1em; border-bottom: 1px dashed var(--border-color); padding-bottom: 5px; text-transform: uppercase;}
        .outcome { font-size: 1.1em; color: #fff; line-height: 1.5;}

        .slider-wrapper { overflow-x: auto; white-space: nowrap; padding-bottom: 15px; }
        .slide { 
            display: inline-block; width: 300px; margin-right: 15px; 
            background: var(--bg-color); border: 1px solid var(--border-color); 
            padding: 15px; white-space: normal; vertical-align: top;
            border-left: 3px solid var(--accent); height: 150px; overflow-y: auto;
        }

        .assessment { 
            margin-top: 30px; border-top: 2px dashed var(--border-color); padding-top: 20px; text-align: center; 
        }
        
        /* Custom Scrollbar for slides */
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>

    <header>
        <img id="header-logo" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgSYNn9nngywuqCte2jKxN2s4D7Owmx1oxMKnR1EX6Ztnlae5gBmjX04sCLUxFQRg5tn6nb-5Cq99jMEC8arVbXBGNn7EDQahw-UeYSQoKBMffwR5tt7ebkQLOaDZJh3eigazifoo5W3LjRAY6HmURI-SnXHVPD8yXHwbGmmPIHsngqPn4EIhJZNCm3b7aS/s1600/logom-svg.png" alt="Logo">
        <h1>RAYILMAZAN</h1>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="switchTab(5)">5. SINIF PLANI</div>
        <div class="tab" onclick="switchTab(6)">6. SINIF PLANI</div>
    </div>

    <div class="container">
        <div class="week-nav">
            <button onclick="changeWeek(-1)">&lt; Önceki Hafta</button>
            <div class="date-display" id="week-display">Hafta Hesaplanıyor...</div>
            <button onclick="changeWeek(1)">Sonraki Hafta &gt;</button>
        </div>

        <div class="data-box">
            <h3>Konu / İçerik</h3>
            <div id="topic-display" class="outcome">Yükleniyor...</div>
        </div>

        <div class="data-box">
            <h3>Öğrenim Çıktısı (Deftere Yazılacak)</h3>
            <div id="outcome-display" class="outcome">Yükleniyor...</div>
        </div>

        <div class="data-box">
            <h3>Süreç Bileşenleri</h3>
            <div class="slider-wrapper" id="process-slider">
                <!-- Slaytlar buraya eklenecek -->
            </div>
        </div>

        <div class="assessment">
            <p id="exam-status" style="color: var(--text-secondary);"></p>
            <button onclick="generateTestPDF()">DEĞERLENDİRME TESTİ (PDF) HAZIRLA</button>
        </div>
    </div>

<script>
    // 2026-2027 Eğitim Öğretim Yılı plan verileri
    const planData = {
        5: [
            { week: 1, topic: "Bilişim Teknolojilerinin Sınıflandırılması", outcome: "BTY.5.1.1. Günlük yaşamda kullanılan bilişim teknolojilerini sınıflandırabilme", process: "Öğrencilerle tanışma etkinliği, ders içerikleri ve TYMM BTY hakkında bilgilendirme yapılır.<br>a) Bilişim teknolojilerine ilişkin temel kavramları belirler.<br>b) Geçmişten günümüze benzerlik ve farklılıkları ilişkilendirir." },
            { week: 2, topic: "Bilişim Teknolojilerinin Etkileri ve Dijital Sağlık", outcome: "BTY.5.1.1. Günlük yaşamda kullanılan bilişim teknolojilerini sınıflandırabilme<br>BTY.5.1.2. Birey ve toplum üzerindeki etkilerini özetleyebilme", process: "c) Kullanım alanlarına göre gruplandırır.<br>a) Olumlu ve olumsuz yönleri ile ilgili çözümleme yapar.<br>b) Fiziksel güvenlik önlemleri ile ilgili sınıflandırma yapar.<br>c) Beden ve ruh sağlığı üzerindeki etkilerini ifade eder." },
            { week: 3, topic: "Dijital Vatandaşlık Uygulamaları", outcome: "BTY.5.1.3. Dijital vatandaşlık uygulamalarını sınıflandırabilme", process: "a) Dijital kimlik kavramını belirler.<br>b) Dijital ayak izinin etkilerini ilişkilendirir.<br>c) Dijital vatandaşlık uygulamalarını kullanım alanlarına göre gruplandırır." },
            { week: 4, topic: "Yapay Zekâda Temel Kavram ve Özellikler", outcome: "BTY.5.1.4. Yapay zekâ ile ilgili temel kavramları ve özellikleri sorgulayabilme", process: "a) Yapay zekâya ilişkin merak ettiği konuları tanımlar.<br>b) Yapay zekâ hakkında bilgi toplar.<br>c) Toplanan bilgilerin doğruluğunu değerlendirir." },
            { week: 5, topic: "Codeweek 2026", outcome: "Yerli ve millî teknolojiler temasıyla okul içi kodlama", process: "Kodlama ve problem çözme etkinlikleri yapılır." },
            { week: 6, topic: "Bilgisayar Sistemlerinin Kullanımı", outcome: "BTY.5.1.5. Bilgisayar sistemlerini çözümleyebilme", process: "a) Temel bileşenleri belirler.<br>b) Bileşenler arası ilişkileri belirler (Donanım)." },
            { week: 7, topic: "Bilgisayar Sistemlerinin Kullanımı (Yazılım)", outcome: "BTY.5.1.5. Bilgisayar sistemlerini çözümleyebilme", process: "b) Bilgisayar sistemlerinin temel bileşenleri arasındaki ilişkileri belirler (Yazılım)." },
            { week: 8, topic: "Dosya ve Klasör Yönetimi", outcome: "BTY.5.1.6. Dosya ve klasör yönetimi ile ilgili temel işlemlerle çalışabilme", process: "a) Temel dosya ve klasör düzenleme işlemlerini belirler.<br>b) Sıkıştırma işlemlerini değerlendirir." },
            { week: 15, topic: "Bilgisayar Ağları ve Ağ Bileşenleri", outcome: "BTY.5.3.1. Bilgisayar ağları ve bileşenlerini sorgulayabilme", process: "a) Bilgisayar ağları hakkında bilgi toplar.<br>b) Topladığı bilgiler hakkında çıkarım yapar." },
            { week: 16, topic: "Bilgisayar Ağ Türleri ve Bağlanma Yöntemleri", outcome: "BTY.5.3.2. Bilgisayar ağları ve bağlanma yöntemlerini sınıflandırabilme", process: "a) Bağlanma yöntemlerini belirler.<br>b) Bileşenlerin işlevlerini gruplandırır." }
        ],
        6: [
            { week: 1, topic: "Yenilikçi Bilişim Teknolojileri", outcome: "BTY.6.1.1. Yenilikçi bilişim teknolojilerini sınıflandırabilme", process: "a) Yenilikçi kavramları belirler.<br>b) Günlük hayatı kolaylaştırmadaki rolüyle ilişkilendirir.<br>c) Kullanım alanlarına göre gruplandırır." },
            { week: 2, topic: "Bilişim Teknolojilerinin Geleceği", outcome: "BTY.6.1.2. Bilişim teknolojinin gelecekteki durumlarına yönelik çıkarım yapabilme", process: "a) Gelişimden yola çıkarak varsayımlarda bulunur.<br>b) Olası durumlarına yönelik örüntüleri listeler.<br>c) Toplum üzerindeki etkilerini değerlendirir." },
            { week: 3, topic: "Tablolama Programlarına Giriş", outcome: "BTY.6.2.1. Tablolama programlarından yararlanabilme", process: "a) Temel özelliklerini tanır.<br>b) Arayüz özelliklerini kullanır.<br>c) Verimliliği açısından değerlendirir." },
            { week: 4, topic: "Veri Toplama, Düzenleme ve Analizi", outcome: "BTY.6.2.2. Problemleri belirleyebilme<br>BTY.6.2.4. Bulgulara ulaşabilme", process: "a) Veriye dayalı araştırma soruları oluşturur.<br>b) Verileri toplar ve kullanıma hazır hâle getirir.<br>c) Tablolama programları kullanarak verileri analiz eder." },
            { week: 5, topic: "Codeweek 2026", outcome: "Yerli ve millî teknolojiler temasıyla okul içi kodlama", process: "Kodlama ve problem çözme etkinlikleri yapılır." },
            { week: 6, topic: "Ses Düzenleme Programlarına Giriş", outcome: "BTY.6.2.5. Ses düzenleme programlarından yararlanabilme", process: "a) Ses dosyası hazırlanacak problemi belirler.<br>b) Hikâye/senaryo unsurlarını belirler." },
            { week: 7, topic: "Ses Dosyası Geliştirme", outcome: "BTY.6.2.7. Ses dosyası geliştirebilme", process: "a) Tasarlanan unsurlardan uyumlu ses dosyası oluşturur.<br>b) Belirlenen ölçütler açısından değerlendirir." },
            { week: 8, topic: "Video Düzenleme Programlarına Giriş", outcome: "BTY.6.2.8. Video düzenleme programlarından yararlanabilme", process: "a) Video dosyası için problemi belirler.<br>b) Hikâye/senaryo oluşturur." },
            { week: 15, topic: "Yapay Zekâda Verinin Rolü", outcome: "BTY.6.5.1. Yapay zekâ girdileri hakkında bilgi toplayabilme", process: "a) Gerekli araçları belirler.<br>b) Bilgileri bulur ve doğrular.<br>c) Ulaşılan bilgileri kaydeder." },
            { week: 16, topic: "Yapay Zekâ Araçları", outcome: "BTY.6.5.2. Yapay zekâ araç ve teknolojileri ile çalışabilme", process: "a) Kullanacağı yapay zekâ aracını belirler.<br>b) Aracı kullanır ve verimliliğini değerlendirir." }
        ]
    };

    let currentGrade = 5;
    let currentWeek = 1;
    let logoBase64 = null;

    // Logo resmini PDF'e basabilmek için base64 formatına dönüştürüyoruz
    async function initLogo() {
        try {
            const res = await fetch("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgSYNn9nngywuqCte2jKxN2s4D7Owmx1oxMKnR1EX6Ztnlae5gBmjX04sCLUxFQRg5tn6nb-5Cq99jMEC8arVbXBGNn7EDQahw-UeYSQoKBMffwR5tt7ebkQLOaDZJh3eigazifoo5W3LjRAY6HmURI-SnXHVPD8yXHwbGmmPIHsngqPn4EIhJZNCm3b7aS/s1600/logom-svg.png");
            const blob = await res.blob();
            const reader = new FileReader();
            reader.onloadend = function() { logoBase64 = reader.result; }
            reader.readAsDataURL(blob);
        } catch (e) {
            console.warn("Logo yüklenirken CORS veya ağ hatası oluştu, PDF'te sadece metin kullanılacak.");
        }
    }
    
    function calculateCurrentWeek() {
        const startDate = new Date('2026-09-14T00:00:00');
        const today = new Date();
        const diffTime = today - startDate;
        const diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));
        currentWeek = diffWeeks >= 0 ? diffWeeks + 1 : 1; 
        if(currentWeek > 36) currentWeek = 36; 
    }

    function switchTab(grade) {
        currentGrade = grade;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        renderData();
    }

    function changeWeek(direction) {
        currentWeek += direction;
        if(currentWeek < 1) currentWeek = 1;
        if(currentWeek > 36) currentWeek = 36;
        renderData();
    }

    function isExamPrepWeek(week) {
        // Sınav haftalarından önceki haftalar (Örnek: 7., 14., 24. ve 32. haftalar)
        const prepWeeks = [7, 14, 24, 32];
        return prepWeeks.includes(week);
    }

    function renderData() {
        document.getElementById('week-display').innerText = `${currentWeek}. HAFTA (Sınıf: ${currentGrade})`;
        
        let plan = planData[currentGrade].find(p => p.week === currentWeek);
        if(!plan) {
            plan = { topic: "Veri Bulunamadı", outcome: "Bu hafta için sistemde plan kaydı yoktur.", process: "Boş" };
        }

        document.getElementById('topic-display').innerHTML = plan.topic;
        document.getElementById('outcome-display').innerHTML = plan.outcome;

        // Süreç bileşenlerini yan yana dizilmiş slayt kartlarına ayırma
        const processSlider = document.getElementById('process-slider');
        const processes = plan.process.split('<br>').filter(p => p.trim() !== '');
        
        processSlider.innerHTML = processes.map((p, index) => {
            return `<div class="slide">
                        <strong style="color: var(--accent);">Bileşen ${index + 1}</strong>
                        <p>${p}</p>
                    </div>`;
        }).join('');

        // Sınav öncesi kontrolü
        const examStatus = document.getElementById('exam-status');
        if (isExamPrepWeek(currentWeek)) {
            examStatus.innerText = "SİSTEM UYARISI: Önümüzdeki hafta sınav haftasıdır. Test içeriği 30 soruluk deneme olarak ayarlanmıştır.";
        } else {
            examStatus.innerText = "SİSTEM BİLGİSİ: Standart hafta değerlendirmesi. Test içeriği 10 soru olarak ayarlanmıştır.";
        }
    }

    function generateTestPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        const isPrep = isExamPrepWeek(currentWeek);
        const questionCount = isPrep ? 30 : 10;
        
        let plan = planData[currentGrade].find(p => p.week === currentWeek) || { topic: "Genel Konular" };

        doc.setFont("courier", "bold");
        doc.setFontSize(16);
        doc.text(`RAYILMAZAN - ${currentGrade}. SINIF DEGERLENDIRME TESTI`, 105, 20, null, null, "center");
        
        doc.setFont("courier", "normal");
        doc.setFontSize(10);
        
        let yPos = 35;
        for(let i = 1; i <= questionCount; i++) {
            if(yPos > 260) {
                doc.addPage();
                yPos = 20;
            }
            doc.text(`Soru ${i}: Asagidakilerden hangisi "${plan.topic.substring(0, 30)}..." konusuyla ilgilidir?`, 20, yPos);
            yPos += 7;
            doc.text("A) Soru Cevabi A   B) Soru Cevabi B   C) Soru Cevabi C   D) Soru Cevabi D", 25, yPos);
            yPos += 10;
        }

        const pageCount = doc.internal.getNumberOfPages();
        for(let i = 1; i <= pageCount; i++) {
            doc.setPage(i);
            
            if(logoBase64) {
                // Logoyu sayfa altına hizalama
                doc.addImage(logoBase64, 'PNG', 95, 275, 20, 20);
            }
            doc.setFontSize(12);
            doc.setFont("courier", "bold");
            doc.text("RAYILMAZAN", 105, 272, null, null, "center");
        }

        doc.save(`Rayilmazan_Sinav_${currentGrade}_Sinif_Hafta_${currentWeek}.pdf`);
    }

    // Uygulama Başlatma
    window.onload = () => {
        initLogo();
        calculateCurrentWeek();
        renderData();
    };
</script>
</body>
</html>
