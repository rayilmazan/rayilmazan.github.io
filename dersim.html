<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Programı ve Öğrenme Çıktıları</title>
    <style>
        :root {
            --primary-color: #1e293b;
            --secondary-color: #0284c7;
            --accent-color: #16a34a;
            --break-color: #d97706;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #e2e8f0;
            --empty-color: #94a3b8;
            --highlight-row-bg: #e8f5e9;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 4px;
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        header {
            background-color: var(--card-bg);
            padding: 5px 8px;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            text-align: center;
            flex-shrink: 0;
        }

        .week-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .status-card {
            background-color: var(--card-bg);
            border-left: 3px solid var(--secondary-color);
            padding: 5px 8px;
            border-radius: 5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 0.78rem;
            flex-shrink: 0;
        }

        .status-text {
            font-weight: 600;
        }

        .table-responsive {
            width: 100%;
            flex: 1 1 0;
            background-color: var(--card-bg);
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: center;
            table-layout: fixed;
        }

        tbody tr {
            height: calc(100% / 7);
        }

        th, td {
            padding: 4px 6px;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.72rem;
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 700;
            border-top: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 12;
            font-size: 0.75rem;
        }

        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 10;
            background-color: #f8fafc;
            border-left: 1px solid var(--border-color);
            width: 45px;
            min-width: 45px;
            max-width: 45px;
            white-space: nowrap;
        }

        th.sticky-col {
            z-index: 13;
            background-color: #f1f5f9 !important;
        }

        .time-subtext {
            display: block;
            font-size: 0.58rem;
            color: #64748b;
            font-weight: normal;
            margin-top: 1px;
        }

        .empty-slot {
            color: var(--empty-color);
            font-style: italic;
        }

        .lesson-slot {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .lesson-info {
            display: flex;
            flex-direction: column;
            text-align: left;
            flex: 1;
        }

        /* Günlük görünümde hücrenin yanında görünecek rozet */
        .daily-outcome {
            font-size: 0.62rem;
            color: #0369a1;
            background-color: #e0f2fe;
            padding: 3px 6px;
            border-radius: 4px;
            border-left: 2px solid var(--secondary-color);
            max-width: 55%;
            text-align: left;
            white-space: normal;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        tr.active-row td {
            background-color: var(--highlight-row-bg) !important;
        }

        tr.active-row td.sticky-col {
            border-left: 2px solid var(--accent-color);
            background-color: #d1fae5 !important;
        }

        .active-cell {
            font-weight: bold;
            background-color: #bbf7d0 !important;
            border: 1px solid var(--accent-color) !important;
            color: #14532d !important;
        }

        .active-cell::after {
            content: "● ŞU AN";
            display: block;
            font-size: 0.5rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-top: 1px;
        }

        .active-day-header {
            background-color: #e0f2fe !important;
            color: #0369a1 !important;
        }

        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 5px 8px;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 4px;
            flex-shrink: 0;
        }

        .nav-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .nav-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.72rem;
            transition: 0.2s;
        }

        .nav-btn:hover {
            opacity: 0.9;
        }

        .today-btn {
            background-color: #64748b;
        }

        .toggle-view-btn {
            background-color: #0d9488;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="week-title" id="weekTitle">Ders Programı</div>
    </header>

    <div class="status-card" id="statusCard">
        <div class="status-text" id="statusText">🏠 Sistem Hazır</div>
        <div id="clockText" style="font-weight: bold; color: var(--secondary-color); font-size: 0.75rem;"></div>
    </div>

    <!-- Üst alandaki outcome-container tamamen kaldırıldı -->

    <div class="table-responsive">
        <table>
            <thead id="scheduleHeader"></thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div class="bottom-controls">
        <div class="nav-group">
            <button class="nav-btn" id="prevBtn">← Önceki</button>
            <button class="nav-btn today-btn" id="todayBtn">Bugün</button>
            <button class="nav-btn" id="nextBtn">Sonraki →</button>
        </div>
        <div>
            <button class="nav-btn toggle-view-btn" id="toggleViewBtn">📅 Tüm Hafta</button>
        </div>
    </div>
</div>

<script>
    let isWeeklyView = false;
    
    // Sınıflara göre öğrenme çıktıları
    const outcomes = {
        5: "BTY.5.1.1. Bilişim teknolojilerinin günlük yaşamdaki önemini fark eder.",
        6: "BTY.6.1.1. Problem çözme adımlarını ve algoritma mantığını kavrar."
    };

    const timeSlots = [
        { period: "1.D", time: "08:30" },
        { period: "2.D", time: "09:30" },
        { period: "3.D", time: "10:20" },
        { period: "4.D", time: "11:10" },
        { period: "5.D", time: "12:30" },
        { period: "6.D", time: "13:20" },
        { period: "7.D", time: "14:10" }
    ];

    const days = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma"];

    const scheduleData = {
        "Pazartesi": [
            { text: "5. Sınıf Bilişim", grade: 5 },
            { text: "5. Sınıf Bilişim", grade: 5 },
            { text: "6. Sınıf Bilişim", grade: 6 },
            { text: "6. Sınıf Bilişim", grade: 6 },
            { text: "-", grade: null },
            { text: "-", grade: null },
            { text: "-", grade: null }
        ],
        "Salı": [
            { text: "-", grade: null },
            { text: "6. Sınıf Bilişim", grade: 6 },
            { text: "6. Sınıf Bilişim", grade: 6 },
            { text: "5. Sınıf Bilişim", grade: 5 },
            { text: "5. Sınıf Bilişim", grade: 5 },
            { text: "-", grade: null },
            { text: "-", grade: null }
        ],
        "Çarşamba": [
            { text: "5. Sınıf Bilişim", grade: 5 },
            { text: "5. Sınıf Bilişim", grade: 5 },
            { text: "-", grade: null },
            { text: "6. Sınıf Bilişim", grade: 6 },
            { text: "6. Sınıf Bilişim", grade: 6 },
            { text: "-", grade: null },
            { text: "-", grade: null }
        ],
        "Perşembe": [
            { text: "6. Sınıf Bilişim", grade: 6 },
            { text: "6. Sınıf Bilişim", grade: 6 },
            { text: "5. Sınıf Bilişim", grade: 5 },
            { text: "5. Sınıf Bilişim", grade: 5 },
            { text: "-", grade: null },
            { text: "-", grade: null },
            { text: "-", grade: null }
        ],
        "Cuma": [
            { text: "-", grade: null },
            { text: "-", grade: null },
            { text: "6. Sınıf Bilişim", grade: 6 },
            { text: "5. Sınıf Bilişim", grade: 5 },
            { text: "5. Sınıf Bilişim", grade: 5 },
            { text: "-", grade: null },
            { text: "-", grade: null }
        ]
    };

    let currentDayIndex = 3; // Perşembe

    function renderSchedule() {
        const headerRow = document.getElementById('scheduleHeader');
        const bodyRows = document.getElementById('scheduleBody');
        const weekTitle = document.getElementById('weekTitle');
        const toggleBtn = document.getElementById('toggleViewBtn');

        headerRow.innerHTML = '';
        bodyRows.innerHTML = '';

        if (isWeeklyView) {
            weekTitle.textContent = "Haftalık Ders Programı Görünümü";
            toggleBtn.textContent = "📅 Günlük Görünüm";

            let headerHTML = '<th class="sticky-col">Saat</th>';
            days.forEach(day => {
                headerHTML += `<th>${day}</th>`;
            });
            headerRow.innerHTML = `<tr>${headerHTML}</tr>`;

            timeSlots.forEach((slot, rowIndex) => {
                let tr = document.createElement('tr');
                let tdTime = document.createElement('td');
                tdTime.className = 'sticky-col';
                tdTime.innerHTML = `<strong>${slot.period}</strong><span class="time-subtext">${slot.time}</span>`;
                tr.appendChild(tdTime);

                days.forEach(day => {
                    let td = document.createElement('td');
                    let lesson = scheduleData[day][rowIndex];
                    if (lesson && lesson.grade) {
                        td.className = 'lesson-slot';
                        td.textContent = lesson.text;
                    } else {
                        td.className = 'empty-slot';
                        td.textContent = '-';
                    }
                    tr.appendChild(td);
                });
                bodyRows.appendChild(tr);
            });

        } else {
            let currentDayName = days[currentDayIndex];
            weekTitle.textContent = `${currentDayName} Günü Ders Programı`;
            toggleBtn.textContent = "📅 Tüm Hafta";

            let headerHTML = `<th class="sticky-col">Saat</th><th class="active-day-header">${currentDayName}</th>`;
            headerRow.innerHTML = `<tr>${headerHTML}</tr>`;

            timeSlots.forEach((slot, rowIndex) => {
                let tr = document.createElement('tr');
                let tdTime = document.createElement('td');
                tdTime.className = 'sticky-col';
                tdTime.innerHTML = `<strong>${slot.period}</strong><span class="time-subtext">${slot.time}</span>`;
                tr.appendChild(tdTime);

                let td = document.createElement('td');
                let lesson = scheduleData[currentDayName][rowIndex];

                // Sadece günlük görünümde o anki sınıfın çıktısını hücrenin yanına ekliyoruz
                if (lesson && lesson.grade) {
                    td.className = 'lesson-slot';
                    let outcomeText = outcomes[lesson.grade] || "";
                    
                    td.innerHTML = `
                        <div class="lesson-info">
                            <span>${lesson.text}</span>
                        </div>
                        <div class="daily-outcome" title="${outcomeText}">
                            🎯 ${outcomeText}
                        </div>
                    `;
                } else {
                    td.className = 'empty-slot';
                    td.textContent = '-';
                }

                tr.appendChild(td);
                bodyRows.appendChild(tr);
            });
        }
    }

    document.getElementById('toggleViewBtn').addEventListener('click', () => {
        isWeeklyView = !isWeeklyView;
        renderSchedule();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
        if (!isWeeklyView) {
            currentDayIndex = (currentDayIndex - 1 + days.length) % days.length;
            renderSchedule();
        }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
        if (!isWeeklyView) {
            currentDayIndex = (currentDayIndex + 1) % days.length;
            renderSchedule();
        }
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
        isWeeklyView = false;
        currentDayIndex = 3;
        renderSchedule();
    });

    setInterval(() => {
        const now = new Date();
        document.getElementById('clockText').textContent = now.toLocaleTimeString('tr-TR');
    }, 1000);

    renderSchedule();
</script>

</body>
</html>
