<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teknoloji RSS Canlı Akışı</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --primary-color: #2563eb;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 {
            margin: 0;
            font-size: 1.3rem;
            color: #1e293b;
        }
        .refresh-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .refresh-btn:hover {
            background-color: #1d4ed8;
        }
        .feed-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .feed-header {
            padding: 14px 16px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 1rem;
            color: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .feed-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 9999px;
            background: #e0f2fe;
            color: #0369a1;
        }
        .feed-items {
            padding: 14px 16px;
            max-height: 75vh;
            overflow-y: auto;
        }
        .news-item {
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .news-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-muted);
        }
        .news-source {
            font-weight: 600;
            color: var(--primary-color);
            background: #eff6ff;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .news-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1e293b;
            text-decoration: none;
            display: block;
            line-height: 1.4;
        }
        .news-title:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }
        .loading, .error {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
        }
        .error {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Teknoloji RSS Canlı Akışı</h1>
            <button class="refresh-btn" onclick="loadAllFeeds()">Tümünü Yenile</button>
        </header>
        
        <div class="feed-card">
            <div class="feed-header">
                <span>Teknoloji Akışı (Oyunlar Filtrelenmiştir)</span>
                <span class="feed-badge" id="totalCount">Yükleniyor...</span>
            </div>
            <div class="feed-items" id="sharedFeedContainer">
                <div class="loading">Haberler yükleniyor ve filtreleniyor...</div>
            </div>
        </div>
    </div>

    <script>
        const feeds = [
            { name: "Donanım Haber", url: "https://www.donanimhaber.com/rss/tum/" },
            { name: "CHIP Online", url: "https://www.chip.com.tr/rss" },
            { name: "NTV Teknoloji", url: "https://www.ntv.com.tr/teknoloji.rss" },
            { name: "Technopat", url: "https://www.technopat.net/feed/" },
            { name: "Webtekno", url: "https://www.webtekno.com/rss.xml" }
        ];

        // Oyun ve espor ile ilgili filtrelenecek anahtar kelimeler
        const oyunKelimeleri = [
            'oyun', 'game', 'steam', 'ps5', 'xbox', 'playstation', 
            'nintendo', 'epic games', 'espor', 'e-spor', 'twitch', 
            'valorant', 'minecraft', 'gta', 'fifa', 'fc 24', 'fc 25'
        ];

        function formatDate(dateString) {
            if (!dateString) return '';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return dateString;
            }
        }

        async function loadAllFeeds() {
            const container = document.getElementById('sharedFeedContainer');
            const badge = document.getElementById('totalCount');
            container.innerHTML = `<div class="loading">Haberler yükleniyor ve filtreleniyor...</div>`;
            
            let allNews = [];

            // Tüm RSS kaynaklarını paralel olarak çek
            const promises = feeds.map(async (feed) => {
                try {
                    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
                    const response = await fetch(apiUrl);
                    const data = await response.json();

                    if (data.status === 'ok' && data.items) {
                        data.items.forEach(item => {
                            const titleLower = item.title.toLowerCase();
                            // Başlıkta oyun kelimesi geçip geçmediğini kontrol et
                            const isGame = oyunKelimeleri.some(kelime => titleLower.includes(kelime));

                            // Oyun değilse listeye ekle
                            if (!isGame) {
                                allNews.push({
                                    source: feed.name,
                                    title: item.title,
                                    link: item.link,
                                    pubDate: item.pubDate
                                });
                            }
                        });
                    }
                } catch (error) {
                    console.error(`${feed.name} yüklenirken hata oluştu:`, error);
                }
            });

            await Promise.all(promises);

            // Haberleri tarihe göre yeniden eskiye sırala
            allNews.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

            // Ekrana bas
            if (allNews.length > 0) {
                container.innerHTML = '';
                allNews.forEach(item => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'news-item';
                    itemEl.innerHTML = `
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="news-title">${item.title}</a>
                        <div class="news-meta">
                            <span class="news-source">${item.source}</span>
                            <span>${formatDate(item.pubDate)}</span>
                        </div>
                    `;
                    container.appendChild(itemEl);
                });
                badge.textContent = `${allNews.length} Haber`;
            } else {
                container.innerHTML = `<div class="error">Gösterilecek haber bulunamadı.</div>`;
                badge.textContent = `0 Haber`;
            }
        }

        // Sayfa açıldığında yükle
        loadAllFeeds();
    </script>
</body>
</html>
