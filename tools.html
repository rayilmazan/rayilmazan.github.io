<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayılmazan tools</title>
    <style>
        :root {
            --bg-color: #0f172a; /* Derin koyu lacivert/siyah */
            --panel-bg: #1e293b; /* Kart arka planı */
            --primary-blue: #3b82f6; /* Canlı mavi vurgu */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.05), transparent 25%);
        }

        .dashboard {
            background-color: var(--panel-bg);
            width: 100%;
            max-width: 1000px;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
            border: 2px solid var(--primary-blue);
        }

        .logo {
            width: 100%;
            height: auto;
        }

        .header-text {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .title span {
            color: var(--primary-blue);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .tool-card {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--primary-blue);
            transform: scaleY(0);
            transition: transform 0.3s ease;
            transform-origin: bottom;
        }

        .tool-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .tool-name {
            font-size: 1rem;
            font-weight: 500;
        }

        /* Hover Efektleri */
        .tool-card:hover {
            background-color: rgba(59, 130, 246, 0.05);
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .tool-card:hover::before {
            transform: scaleY(1);
        }

        .tool-card:hover .tool-indicator {
            background-color: var(--primary-blue);
            box-shadow: 0 0 10px var(--primary-blue);
        }

        @media (max-width: 600px) {
            .dashboard {
                padding: 25px;
            }
            .title {
                font-size: 1.5rem;
            }
            .tools-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header class="header">
            <div class="logo-container">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj1-M4NRPHZ0Hk1kYGTLtH5_UhWf_wOhs2gx4GE6Os1MxKbmr_vZMs8fS5Q36X-eT8bK6DXGpLuS5HI1ym4Gt5CmAom8AfjUERieSTJ5pGqijLr_4dV5SjLWhcvTE3wqIppJmlzAcWEEiQQunaEmlrU2hIoxJ9BlSc_9HUA-FiRsgYqN0B7kTsFfJLx3MoT/s1600/kucuklogom.png" alt="rayılmazan Logo" class="logo">
            </div>
            <div class="header-text">
                <h1 class="title">rayılmazan <span>tools</span></h1>
                <div class="subtitle">Çevrimdışı Web Araçları Yönetim Paneli</div>
            </div>
        </header>

        <div class="tools-grid">
            <a href="https://rayilmazan.github.io/caocr.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">CA OCR</span>
            </a>
            <a href="https://rayilmazan.github.io/convert.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">Convert</span>
            </a>
            <a href="https://rayilmazan.github.io/fotopdf.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">Foto PDF</span>
            </a>
            <a href="https://rayilmazan.github.io/kible.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">Kıble</span>
            </a>
            <a href="https://rayilmazan.github.io/kitapcik.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">Kitapçık</span>
            </a>
            <a href="https://rayilmazan.github.io/ocr.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">OCR</span>
            </a>
            <a href="https://rayilmazan.github.io/pardus.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">Pardus</span>
            </a>
            <a href="https://rayilmazan.github.io/pdf.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">PDF</span>
            </a>
            <a href="https://rayilmazan.github.io/sinavkagidi.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">Sınav Kağıdı</span>
            </a>
            <a href="https://rayilmazan.github.io/subeoturum.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">Şube Oturum</span>
            </a>
            <a href="https://rayilmazan.github.io/suratgizle.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">Surat Gizle</span>
            </a>
            <a href="https://rayilmazan.github.io/suterazi.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">Su Terazisi</span>
            </a>
            <a href="https://rayilmazan.github.io/usb.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">USB</span>
            </a>
            <a href="https://rayilmazan.github.io/yakakart.html" class="tool-card" target="_blank">
                <div class="tool-indicator"></div>
                <span class="tool-name">Yaka Kartı</span>
            </a>
        </div>
    </div>

</body>
</html>
