<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayılmazan tools</title>
    <style>
        :root {
            --bg-color: #f4f4f4; /* Kirli beyaz arka plan */
            --panel-bg: #e0e0e0; /* Yıpranmış beyaz panel */
            --metal-light: #aaa; /* Panel kenarlığı için hafif metal */
            --metal-dark: #666; /* Panel kenarlığı için koyu metal */
            --accent-blue: #4a90e2; /* Mavi vurgu */
            --text-color: #333; /* Koyu metin */
            --rust-color: #a5611c; /* Pas rengi detayları için */
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(45deg, #e6e6e6 25%, transparent 25%, transparent 75%, #e6e6e6 75%, #e6e6e6), 
                linear-gradient(45deg, #e6e6e6 25%, transparent 25%, transparent 75%, #e6e6e6 75%, #e6e6e6);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .main-container {
            background: var(--panel-bg);
            /* Kir ve aşınma dokusu ekle (CSS gradient ve gürültü overlay) */
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px),
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiIHZpZXdCb3g9IjAgMCA0IDQiPjxnIGZpbGwtcnVsZT0iZXZlbm9kZCI+PGcgZmlsbD0iIzMzMyIgZmlsbC1vcGFjaXR5PSIwLjA1Ij48cGF0aCBkPSJNMCAwaDR2NEgwVjB6bTIgMnYyaDJWMkgyeiIvPjwvZz48L2c+PC9zdmc+'); /* Hafif gürültü overlay */
            background-size: 50px 50px, 50px 50px, 4px 4px;
            border: 3px solid var(--metal-light);
            border-bottom-color: var(--metal-dark);
            border-right-color: var(--metal-dark);
            box-shadow: 
                inset 2px 2px 0px rgba(255, 255, 255, 0.5), /* Daha parlak iç kenar */
                5px 5px 15px rgba(0, 0, 0, 0.3), /* Daha hafif dış gölge */
                inset -3px -3px 5px rgba(0, 0, 0, 0.1); /* Hafif kirli gölge */
            border-radius: 4px;
            padding: 30px;
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        /* Panel köşelerindeki vida detayları (Paslı his) */
        .main-container::before, .main-container::after {
            content: '';
            position: absolute;
            width: 12px; height: 12px;
            background: radial-gradient(circle, #777, #444, #222);
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.8), 1px 1px 1px rgba(255,255,255,0.2);
        }
        .main-container::before { top: 10px; left: 10px; }
        .main-container::after { top: 10px; right: 10px; }

        .screw-bottom-left, .screw-bottom-right {
            position: absolute;
            width: 12px; height: 12px;
            background: radial-gradient(circle, #777, #444, #222);
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.8), 1px 1px 1px rgba(255,255,255,0.2);
            bottom: 10px;
        }
        .screw-bottom-left { left: 10px; }
        .screw-bottom-right { right: 10px; }

        .header {
            display: flex;
            align-items: center;
            border-bottom: 2px dashed #bbb; /* Daha açık kesikli çizgi */
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: auto;
            border: 2px solid var(--metal-dark);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            margin-right: 20px;
            background: #fdfdfd; /* Logo konteyneri temiz beyaz yap */
            padding: 2px;
        }

        .title {
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-color); /* Koyu metin */
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8); /* Açık gölge */
            margin: 0;
            flex-grow: 1;
        }

        .status-light {
            width: 15px;
            height: 15px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-blue);
            border: 2px solid var(--metal-dark); /* Koyu çerçeve */
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fdfdfd, #e6e6e6); /* Yıpranmış beyaz metal */
            border: 2px solid var(--metal-light);
            border-bottom-color: var(--metal-dark);
            border-right-color: var(--metal-dark);
            color: var(--text-color); /* Koyu metin */
            text-decoration: none;
            padding: 15px 10px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            position: relative;
            transition: all 0.1s ease-in-out;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2); /* Daha hafif gölge */
        }

        /* Düğme üzerindeki mekanik detayı */
        .tool-btn::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 20px;
            background: var(--rust-color); /* Paslı gibi detayı yap */
            border-right: 1px solid #ddd;
        }

        .tool-btn:hover {
            background: linear-gradient(135deg, #dceefc, #bbdefb); /* Mavi tonlu beyaz */
            color: #fff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.5), inset 0 0 5px rgba(0,0,0,0.3);
        }

        .tool-btn:active {
            transform: translateY(2px) translateX(2px);
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.4);
            border-top-color: var(--metal-dark);
            border-left-color: var(--metal-dark);
            border-bottom-color: var(--metal-light);
            border-right-color: var(--metal-light);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Alt vidalar -->
        <div class="screw-bottom-left"></div>
        <div class="screw-bottom-right"></div>

        <div class="header">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj1-M4NRPHZ0Hk1kYGTLtH5_UhWf_wOhs2gx4GE6Os1MxKbmr_vZMs8fS5Q36X-eT8bK6DXGpLuS5HI1ym4Gt5CmAom8AfjUERieSTJ5pGqijLr_4dV5SjLWhcvTE3wqIppJmlzAcWEEiQQunaEmlrU2hIoxJ9BlSc_9HUA-FiRsgYqN0B7kTsFfJLx3MoT/s1600/kucuklogom.png" alt="rayılmazan Logo" class="logo">
            <h1 class="title">rayılmazan tools</h1>
            <div class="status-light" title="Sistem Aktif"></div>
        </div>

        <div class="grid-container">
            <a href="https://rayilmazan.github.io/caocr.html" class="tool-btn" target="_blank">CA OCR</a>
            <a href="https://rayilmazan.github.io/convert.html" class="tool-btn" target="_blank">Convert</a>
            <a href="https://rayilmazan.github.io/fotopdf.html" class="tool-btn" target="_blank">Foto PDF</a>
            <a href="https://rayilmazan.github.io/kible.html" class="tool-btn" target="_blank">Kıble</a>
            <a href="https://rayilmazan.github.io/kitapcik.html" class="tool-btn" target="_blank">Kitapçık</a>
            <a href="https://rayilmazan.github.io/ocr.html" class="tool-btn" target="_blank">OCR</a>
            <a href="https://rayilmazan.github.io/pardus.html" class="tool-btn" target="_blank">Pardus</a>
            <a href="https://rayilmazan.github.io/pdf.html" class="tool-btn" target="_blank">PDF</a>
            <a href="https://rayilmazan.github.io/sinavkagidi.html" class="tool-btn" target="_blank">Sınav Kağıdı</a>
            <a href="https://rayilmazan.github.io/subeoturum.html" class="tool-btn" target="_blank">Şube Oturum</a>
            <a href="https://rayilmazan.github.io/suratgizle.html" class="tool-btn" target="_blank">Surat Gizle</a>
            <a href="https://rayilmazan.github.io/suterazi.html" class="tool-btn" target="_blank">Su Terazisi</a>
            <a href="https://rayilmazan.github.io/usb.html" class="tool-btn" target="_blank">USB</a>
            <a href="https://rayilmazan.github.io/yakakart.html" class="tool-btn" target="_blank">Yaka Kartı</a>
        </div>
    </div>

</body>
</html>
